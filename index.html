function side(){return `<aside class="sidebar"><div class="side-title">Explorer</div><button class="sidebtn ${route==='home'?'active':''}" onclick="go('home')"><span class="ico">⌂</span><span>Vue d'ensemble</span></button><button class="sidebtn ${route==='catalogue'?'active':''}" onclick="go('catalogue')"><span class="ico">▦</span><span>Catalogue</span></button><button class="sidebtn" onclick="go('booking')"><span class="ico">＋</span><span>Réserver</span></button><button class="sidebtn" onclick="go('compare')"><span class="ico">⇄</span><span>Comparer</span></button><div class="side-title" style="margin-top:18px">Compte</div><button class="sidebtn" onclick="go('client')"><span class="ico">◯</span><span>Mes locations</span></button><button class="sidebtn" onclick="go('login')"><span class="ico">↪</span><span>Se connecter</span></button><div class="side-title" style="margin-top:18px">Gestion</div><button class="sidebtn" onclick="go('admin')"><span class="ico">▥</span><span>Admin</span></button><div class="side-bottom"><b>Besoin d'aide ?</b><p class="muted" style="font-size:11px">Notre assistant peut trouver un véhicule selon votre budget et vos dates.</p><button class="btn" style="width:100%" onclick="openAI()">Ouvrir l'assistant</button></div></aside>`}
function shell(content){return `${nav()}<div class="layout">${side()}<main class="main">${content}</main></div>`}
function carCard(c,small=false){return `<article class="fleet-card card"><button class="heart" onclick="toggleFav('${c[0]}');event.stopPropagation()">${favorites.has(c[0])?'♥':'♡'}</button><div class="car-photo"><img src="${c[7]}" alt="${c[1]} ${c[2]}" loading="lazy" onerror="this.src='${IMG.generic}'"></div><div class="car-meta"><div class="car-title">${c[1]} ${c[2]}</div><div class="car-sub">${c[3]} · ${c[4]}</div><div class="chips"><span class="chip">${c[5]}</span><span class="chip">${c[8]}</span><span class="chip">${c[9]} places</span></div><div class="price"><div><strong>${money(c[6])}</strong> <small>/ jour</small></div><button class="btn primary" onclick="go('vehicle-${c[0]}')">Voir</button></div></div></article>`}
function home(){let featured=cars.slice(0,6);return shell(`<section class="hero reveal"><div class="hero-main card"><div class="hero-copy"><div class="eyebrow">Location automobile nouvelle génération</div><h1 class="hero-title">La bonne voiture.<br><span>Au bon moment.</span></h1><p class="lead">Un parcours simple et visuel : choisissez vos dates, votre agence, votre catégorie et réservez en quelques étapes.</p><div class="searchbox"><div class="field"><label>Départ</label><select id="hcity"><option>Rennes</option><option>Paris</option><option>Nantes</option><option>Lyon</option><option>Bordeaux</option></select></div><div class="field"><label>Du</label><input type="date" id="hfrom"></div><div class="field"><label>Au</label><input type="date" id="hto"></div><button class="btn primary" onclick="startSearch()">Rechercher</button></div></div></div><div class="hero-side"><div class="mini-img card"><span class="tag">Assistant intelligent</span><img src="assets/reference/assistant-ai.jfif" alt="interface assistant"></div><div class="grid g2"><div class="stat card"><div class="n" data-count="128">0</div><div class="l">véhicules disponibles</div></div><div class="stat card"><div class="n" data-count="24">0</div><div class="l">agences partenaires</div></div></div></div></section><section class="section"><div class="section-head"><h2>Choisir par usage</h2><span class="muted">Une sélection pensée pour la location en France</span></div><div class="grid g4"><button class="card pad" onclick="filterCat('Citadine')"><b>Citadine</b><p class="muted">Clio, 208, Sandero, C3…</p></button><button class="card pad" onclick="filterCat('SUV compact')"><b>SUV compact</b><p class="muted">Captur, Duster, 2008…</p></button><button class="card pad" onclick="filterCat('Compacte')"><b>Compacte</b><p class="muted">Golf, Série 1, A3…</p></button><button class="card pad" onclick="filterCat('Électrique')"><b>Électrique</b><p class="muted">e-208, Model 3, Model Y…</p></button></div></section><section class="section"><div class="section-head"><h2>Les plus réservés</h2><button class="btn" onclick="go('catalogue')">Voir toute la flotte</button></div><div class="car-grid">${featured.map(c=>carCard(c)).join('')}</div></section><section class="section assistant card"><div><div class="eyebrow">Comme dans votre interface de référence</div><h2 style="font-size:32px;letter-spacing:-.05em">Un tableau de bord clair, pas un labyrinthe.</h2><p class="lead">Retrouvez les informations essentielles : réservation, véhicule, localisation, calendrier et état de la flotte, dans une interface aérée et pilotable.</p><div class="quote"><strong>“Trouve-moi une automatique à moins de 80 € / jour à Rennes.”</strong><span class="muted">L'assistant filtre instantanément le catalogue.</span></div><br><button class="btn pink" onclick="openAI()">Tester l'assistant</button></div><img src="assets/reference/control-panel.jfif" alt="tableau de bord de référence"></section>`)}
function filterCat(cat){go('catalogue');setTimeout(()=>{let s=document.getElementById('catFilter');if(s){s.value=cat;renderCatalogue() }},30)}
function startSearch(){go('catalogue')}
function catalogue(){return shell(`<div class="page-head"><div><div class="eyebrow">Catalogue</div><h1 class="h1">Trouvez votre véhicule</h1><p class="lead">Des modèles réellement courants en location : citadines, compactes, SUV, premium et électriques. Les prix de démonstration sont modifiables dans l'administration.</p></div><div class="actions"><button class="btn" onclick="go('compare')">Comparer</button><button class="btn primary" onclick="go('booking')">Réserver</button></div></div><div class="card pad"><div class="toolbar"><input class="input" id="searchCar" placeholder="Rechercher Clio, 208, BMW…" oninput="renderCatalogue()"><select class="input" id="catFilter" onchange="renderCatalogue()"><option value="">Toutes catégories</option><option>Citadine</option><option>Compacte</option><option>SUV compact</option><option>SUV</option><option>Berline</option><option>Premium compacte</option><option>Électrique</option></select><select class="input" id="fuelFilter" onchange="renderCatalogue()"><option value="">Énergie</option><option>Essence</option><option>Hybride</option><option>Électrique</option></select><select class="input" id="gearFilter" onchange="renderCatalogue()"><option value="">Boîte</option><option>Automatique</option><option>Manuelle</option></select><select class="input" id="priceFilter" onchange="renderCatalogue()"><option value="">Prix max</option><option value="70">70 €</option><option value="90">90 €</option><option value="120">120 €</option><option value="160">160 €</option></select></div><div id="catalogGrid" class="car-grid"></div></div>`)}
function renderCatalogue(){let q=(document.getElementById('searchCar')?.value||'').toLowerCase(),cat=document.getElementById('catFilter')?.value||'',fuel=document.getElementById('fuelFilter')?.value||'',gear=document.getElementById('gearFilter')?.value||'',max=Number(document.getElementById('priceFilter')?.value||0);let arr=cars.filter(c=>(!q||(c[1]+' '+c[2]).toLowerCase().includes(q))&&(!cat||c[3]===cat)&&(!fuel||c[4].toLowerCase().includes(fuel.toLowerCase()))&&(!gear||c[5]===gear)&&(!max||+c[6]<=max));document.getElementById('catalogGrid').innerHTML=arr.length?arr.map(c=>carCard(c)).join(''):`<div class="empty" style="grid-column:1/-1">Aucun véhicule ne correspond à vos filtres.</div>`}
function vehicle(id){let c=car(id);selectedCar=c;return shell(`<div class="page-head"><div><div class="eyebrow">Détail véhicule</div><h1 class="h1">${c[1]} ${c[2]}</h1><p class="lead">Une fiche visuelle inspirée des configurateurs automobiles : photo, couleurs, caractéristiques et réservation immédiate.</p></div><button class="btn" onclick="go('catalogue')">← Retour</button></div><div class="detail"><div class="visual"><div class="visual-main"><img src="${c[7]}" alt="${c[1]} ${c[2]}" onerror="this.src='${IMG.generic}'"></div><div class="thumbs"><div class="thumb"><img src="${c[7]}" alt=""></div><div class="thumb"><img src="${IMG.generic}" alt=""></div><div class="thumb"><img src="${IMG.austral}" alt=""></div></div></div><div class="detail-side"><div class="card pad"><div class="eyebrow">À partir de</div><div style="font-size:38px;font-weight:950;letter-spacing:-.06em">${money(c[6])}<small style="font-size:14px;color:#7a8691"> / jour</small></div><div class="chips"><span class="chip">${c[3]}</span><span class="chip">${c[4]}</span><span class="chip">${c[5]}</span></div><button class="btn pink" style="width:100%;margin-top:15px" onclick="go('booking-${c[0]}')">Choisir ces dates</button></div><div class="card pad"><h3 style="margin-top:0">Caractéristiques</h3><div class="specs"><div class="spec"><span>Puissance</span><b>${c[8]}</b></div><div class="spec"><span>Places</span><b>${c[9]}</b></div><div class="spec"><span>Coffre</span><b>${c[10]}</b></div><div class="spec"><span>Boîte</span><b>${c[5]}</b></div></div></div><div class="card pad"><h3 style="margin-top:0">Couleur</h3><div class="swatches"><i class="sw" style="background:#fff"></i><i class="sw" style="background:#d4d7dc"></i><i class="sw" style="background:#17202a"></i><i class="sw" style="background:#aabbd8"></i><i class="sw" style="background:#b73d4c"></i></div></div><div class="card pad"><h3 style="margin-top:0">Inclus</h3><div class="chips"><span class="chip">Assistance 24/7</span><span class="chip">Kilométrage selon formule</span><span class="chip">Annulation flexible</span></div></div></div></div>`)}
function bookingPage(id){let c=car(id||selectedCar[0]);selectedCar=c;let days=3;return shell(`<div class="page-head"><div><div class="eyebrow">Réservation</div><h1 class="h1">Réservez ${c[1]} ${c[2]}</h1><p class="lead">Un parcours en 3 étapes, avec calendrier, agence, assurances et récapitulatif toujours visible.</p></div></div><div class="steps"><div class="step active">1 · Dates & agence</div><div class="step">2 · Options</div><div class="step">3 · Paiement</div></div><div class="booking-layout"><div class="grid"><div class="card pad"><h3 style="margin-top:0">1. Vos dates</h3><div class="grid g2"><div><label class="eyebrow">Départ</label><input class="input" style="width:100%" type="date" value="2026-09-22"></div><div><label class="eyebrow">Retour</label><input class="input" style="width:100%" type="date" value="2026-09-25"></div></div><br><label class="eyebrow">Agence de départ</label><select class="input" style="width:100%"><option>Rennes — Gare</option><option>Paris — Montparnasse</option><option>Nantes — Aéroport</option><option>Lyon — Part-Dieu</option><option>Bordeaux — Gare Saint-Jean</option></select><br><br><div class="dategrid"><div class="head">LUN</div><div class="head">MAR</div><div class="head">MER</div><div class="head">JEU</div><div class="head">VEN</div><div class="head">SAM</div><div class="head">DIM</div>${Array.from({length:35},(_,i)=>`<div class="day ${i===22||i===23||i===24?'sel':''}">${i<2?'':((i-1)%30)+1}</div>`).join('')}</div></div><div class="card pad"><h3 style="margin-top:0">2. Protection & options</h3><div class="option"><div><b>Protection standard</b><div class="muted">Franchise 1 200 €</div></div><strong>Inclus</strong></div><div class="option"><div><b>Protection renforcée</b><div class="muted">Franchise réduite à 300 €</div></div><label><input type="radio" name="ins" value="25" onchange="updateBooking()"> +25 €/j</label></div><div class="option"><div><b>Conducteur additionnel</b><div class="muted">Un conducteur en plus</div></div><label><input type="checkbox" value="12" onchange="updateBooking()"> +12 €/j</label></div><div class="option"><div><b>Siège enfant</b><div class="muted">Installation incluse</div></div><label><input type="checkbox" value="7" onchange="updateBooking()"> +7 €/j</label></div></div><div class="card pad"><h3 style="margin-top:0">3. Coordonnées</h3><div class="grid g2"><input class="input" placeholder="Prénom"><input class="input" placeholder="Nom"><input class="input" placeholder="Email"><input class="input" placeholder="Téléphone"></div><p class="muted" style="font-size:11px">Simulation uniquement : aucune carte bancaire réelle n'est débitée.</p><button class="btn pink" style="width:100%" onclick="payModal()">Continuer vers le paiement</button></div></div><aside class="summary card pad"><div class="eyebrow">Votre sélection</div><h2>${c[1]} ${c[2]}</h2><div class="car-photo" style="height:180px"><img src="${c[7]}" alt=""></div><div class="summary-line"><span>${money(c[6])} × ${days} jours</span><b>${money(c[6]*days)}</b></div><div class="summary-line"><span>Protection</span><b id="sumIns">0 €</b></div><div class="summary-line"><span>Options</span><b id="sumOpt">0 €</b></div><div class="summary-total"><span>Total</span><span id="sumTotal">${money(c[6]*days)}</span></div></aside></div>`)}
function updateBooking(){let c=selectedCar,base=+c[6]*3,ins=document.querySelector('input[name=ins]:checked')?.value*3||0,opt=[...document.querySelectorAll('.option input[type=checkbox]:checked')].reduce((a,x)=>a+Number(x.value)*3,0);document.getElementById('sumIns').textContent=money(ins);document.getElementById('sumOpt').textContent=money(opt);document.getElementById('sumTotal').textContent=money(base+ins+opt)}
function payModal(){document.getElementById('modalContent').innerHTML=`<div class="eyebrow">Paiement sécurisé — démo</div><h2>Finaliser votre réservation</h2><p class="muted">Ajoutez une carte fictive pour tester le parcours.</p><input class="input" style="width:100%" placeholder="Numéro de carte — 4242 4242 4242 4242"><div class="grid g2" style="margin-top:8px"><input class="input" placeholder="MM/AA"><input class="input" placeholder="CVC"></div><br><button class="btn pink" style="width:100%" onclick="confirmBooking()">Payer et confirmer</button><button class="btn" style="width:100%;margin-top:8px" onclick="closeModal()">Annuler</button>`;openModal()}
function confirmBooking(){localStorage.setItem('dr_last_booking',JSON.stringify({id:'DR-'+Math.floor(24097+Math.random()*500),car:selectedCar[1]+' '+selectedCar[2],date:'22/09/2026'}));closeModal();toast('Réservation confirmée');go('client')}
function client(){return shell(`<div class="page-head"><div><div class="eyebrow">Espace client</div><h1 class="h1">Bonjour, bienvenue.</h1><p class="lead">Retrouvez vos réservations, favoris et factures au même endroit.</p></div><button class="btn primary" onclick="go('catalogue')">Nouvelle réservation</button></div><div class="grid g4"><div class="kpi card"><div class="eyebrow">Locations</div><div class="value">12</div><div class="delta">+2 ce mois-ci</div></div><div class="kpi card"><div class="eyebrow">Dépenses</div><div class="value">1 284 €</div><div class="delta">sur 12 locations</div></div><div class="kpi card"><div class="eyebrow">Favoris</div><div class="value">${favorites.size}</div><div class="delta">véhicules enregistrés</div></div><div class="kpi card"><div class="eyebrow">Points</div><div class="value">860</div><div class="delta">programme DRIVE/RENT</div></div></div><section class="section"><div class="section-head"><h2>Prochaine location</h2></div><div class="card pad"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><div><div class="eyebrow">22 → 25 septembre 2026 · Rennes</div><h2 style="margin:7px 0">Renault Clio</h2><p class="muted">DR-24091 · Gare de Rennes · Automatique</p></div><span class="status ok">Confirmée</span><button class="btn" onclick="go('vehicle-c01')">Voir le véhicule</button></div></div></section><section class="section"><div class="section-head"><h2>Historique</h2></div><div class="card pad"><table class="table"><thead><tr><th>Référence</th><th>Véhicule</th><th>Dates</th><th>Agence</th><th>Statut</th></tr></thead><tbody>${bookings.slice(0,5).map(b=>`<tr><td>${b.id}</td><td>${b.car}</td><td>${b.from} → ${b.to}</td><td>${b.city}</td><td><span class="status ${b.tone==='green'?'ok':b.tone==='orange'?'warn':'danger'}">${b.status}</span></td></tr>`).join('')}</tbody></table></div></section>`)}
function compare(){let chosen=cars.filter(c=>favorites.has(c[0])).slice(0,4);if(chosen.length<2)chosen=cars.slice(0,4);return shell(`<div class="page-head"><div><div class="eyebrow">Comparateur</div><h1 class="h1">Comparer vos véhicules</h1><p class="lead">Une lecture simple des critères qui comptent pour une location.</p></div></div><div class="card pad" style="overflow:auto"><table class="table"><thead><tr><th>Critère</th>${chosen.map(c=>`<th>${c[1]} ${c[2]}</th>`).join('')}</tr></thead><tbody>${[['Catégorie',3],['Énergie',4],['Boîte',5],['Prix / jour',6],['Puissance',8],['Places',9],['Coffre',10]].map(r=>`<tr><td>${r[0]}</td>${chosen.map(c=>`<td>${r[0]==='Prix / jour'?money(c[r[1]]):c[r[1]]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)}
function login(){return `<header class="topbar"><div class="brand"><i></i>DRIVE/RENT</div><div class="top-actions"><button class="btn" onclick="go('home')">Retour au site</button></div></header><div class="login"><div class="login-card card"><div class="eyebrow">Connexion</div><h1 class="h1">Accéder à votre espace</h1><label class="eyebrow">Email / identifiant</label><input class="input" id="loginUser" placeholder="client ou admin"><label class="eyebrow">Mot de passe</label><input class="input" id="loginPass" type="password" placeholder="client ou admin"><button class="btn primary" style="width:100%;margin-top:8px" onclick="loginAction()">Se connecter</button><div class="grid g2" style="margin-top:12px"><button class="btn" onclick="quickLogin('client')">Démo client / client</button><button class="btn" onclick="quickLogin('admin')">Démo admin / admin</button></div></div></div>`}
function quickLogin(u){document.getElementById('loginUser').value=u;document.getElementById('loginPass').value=u;loginAction()}
function loginAction(){let u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;if(u==='admin'&&p==='admin'){go('admin');return}if(u==='client'&&p==='client'){go('client');return}toast('Identifiants démo : client/client ou admin/admin')}
function admin(){return shell(`<div class="page-head"><div><div class="eyebrow">Administration</div><h1 class="h1">Centre de pilotage</h1><p class="lead">Même logique que les dashboards de référence : une navigation claire, des données visibles et des actions immédiates.</p></div><div class="actions"><button class="btn" onclick="go('admin-live')">Live localisation</button><button class="btn" onclick="go('admin-reservations')">Planning</button></div></div><div class="admin-shell"><div class="admin-nav">${[['overview','Vue générale'],['fleet','Flotte'],['reservations','Planning'],['live','Localisation live'],['analytics','Analytics']].map(x=>`<button class="${adminTab===x[0]?'active':''}" onclick="adminGo('${x[0]}')">${x[1]}</button>`).join('')}</div><div id="adminContent">${adminTab==='overview'?adminOverview():adminTab==='fleet'?adminFleet():adminTab==='reservations'?adminReservations():adminTab==='live'?adminLive():adminAnalytics()}</div></div>`)}
function adminGo(t){adminTab=t;route='admin';history.replaceState(null,'','#admin');render()}
function adminOverview(){return `<div class="grid g4"><div class="kpi card"><div class="eyebrow">Réservations aujourd'hui</div><div class="value" id="liveKpi">28</div><div class="delta">+8,4% vs hier</div></div><div class="kpi card"><div class="eyebrow">Chiffre d'affaires</div><div class="value">18 420 €</div><div class="delta">+12,1% cette semaine</div></div><div class="kpi card"><div class="eyebrow">Flotte active</div><div class="value">94%</div><div class="delta">+3,2 pts</div></div><div class="kpi card"><div class="eyebrow">Taux d'utilisation</div><div class="value">76%</div><div class="delta">sur 7 jours</div></div></div><div class="grid g2 section"><div class="card chart"><div class="section-head"><h2>Réservations — 7 jours</h2><span class="status ok">LIVE</span></div><div class="bars" id="dashBars"></div></div><div class="card pad"><div class="section-head"><h2>Activité en direct</h2><span class="muted">actualisation</span></div><div id="activity"></div></div></div><div class="grid g2 section"><div class="card pad"><div class="section-head"><h2>Réservations à traiter</h2><button class="btn" onclick="adminGo('reservations')">Ouvrir</button></div><table class="table"><tbody>${bookings.slice(0,4).map(b=>`<tr><td><b>${b.id}</b><br><span class="muted">${b.car}</span></td><td>${b.city}</td><td><span class="status ${b.tone==='orange'?'warn':'ok'}">${b.status}</span></td></tr>`).join('')}</tbody></table></div><div class="card pad"><div class="section-head"><h2>Répartition flotte</h2></div><div class="chips" style="margin-bottom:14px"><span class="chip">Citadines 38%</span><span class="chip">SUV 31%</span><span class="chip">Compactes 19%</span><span class="chip">Premium 12%</span></div><div style="height:18px;background:#edf1f4;border-radius:10px;overflow:hidden"><div style="width:38%;height:100%;background:#8ea6ba;display:inline-block"></div><div style="width:31%;height:100%;background:#b9c8d2;display:inline-block"></div><div style="width:19%;height:100%;background:#d2dce3;display:inline-block"></div><div style="width:12%;height:100%;background:#e92f86;display:inline-block"></div></div></div></div>`}
function renderDash(){let el=document.getElementById('dashBars');if(el)el.innerHTML=[38,54,44,71,63,88,77].map((n,i)=>`<div class="bar ${i===6?'hot':''}" style="height:${n*1.65}px" title="${n} réservations"></div>`).join('');let act=document.getElementById('activity');if(act)act.innerHTML=['Clio réservée à Rennes · il y a 2 min','Peugeot 208 restituée à Paris · il y a 5 min','Duster déplacé vers Nantes · il y a 9 min','BMW Série 1 contrôlée · il y a 13 min'].map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line);font-size:12px">${x}</div>`).join('')}
function adminFleet(){return `<div class="card pad"><div class="section-head"><h2>Flotte & tarifs</h2><button class="btn pink" onclick="addCar()">+ Ajouter un véhicule</button></div><p class="muted">Les prix ci-dessous sont des valeurs de démonstration. Modifiez-les directement puis rechargez la page : la démo conserve les modifications.</p><table class="table"><thead><tr><th>Véhicule</th><th>Catégorie</th><th>Prix / jour</th><th>Statut</th><th>Ville</th><th></th></tr></thead><tbody>${cars.slice(0,14).map(c=>`<tr><td><b>${c[1]} ${c[2]}</b></td><td>${c[3]}</td><td><input class="input" style="width:90px;padding:8px" value="${c[6]}" onchange="editPrice('${c[0]}',this.value)"> €</td><td><span class="status ok">Disponible</span></td><td><select class="input" style="padding:8px;width:120px"><option>Rennes</option><option>Paris</option><option>Nantes</option><option>Lyon</option></select></td><td><button class="btn" onclick="go('vehicle-${c[0]}')">Fiche</button></td></tr>`).join('')}</tbody></table></div>`}
function editPrice(id,v){let c=car(id);c[6]=Number(v)||c[6];toast('Prix mis à jour pour '+c[1]+' '+c[2])}
function addCar(){toast('Formulaire d’ajout prêt : modèle, catégorie, photo, prix, agence et disponibilité.')}
function adminReservations(){let days=['22 sept.','23 sept.','24 sept.','25 sept.','26 sept.','27 sept.','28 sept.'];let rows=['Renault Clio','Peugeot 208','Dacia Duster','BMW Série 1','Toyota Yaris','Tesla Model Y'];return `<div class="card pad"><div class="section-head"><div><h2>Planning des réservations</h2><p class="muted">Vue semaine · 22 → 28 septembre 2026</p></div><div class="actions"><button class="btn">‹</button><button class="btn">Aujourd'hui</button><button class="btn">›</button></div></div><div class="calendar"><div class="cal-head"><div>Véhicule</div>${days.map(d=>`<div>${d}</div>`).join('')}</div>${rows.map((r,i)=>`<div class="cal-row"><div class="vehicle-label">${r}<br><span class="muted">${['Rennes','Paris','Nantes','Lyon','Bordeaux','Paris'][i]}</span></div>${days.map((_,d)=>`<div>${(i+d)%7===0?`<div class="res ${i%3===0?'green':i%3===1?'pink':'orange'}">${bookings[i]?.id||'DR-2409'+i}</div>`:''}</div>`).join('')}</div>`).join('')}</div></div><div class="card pad section"><div class="section-head"><h2>Liste détaillée</h2><span class="muted">6 réservations visibles</span></div><table class="table"><thead><tr><th>Référence</th><th>Client</th><th>Véhicule</th><th>Départ</th><th>Retour</th><th>Statut</th></tr></thead><tbody>${bookings.map(b=>`<tr><td><b>${b.id}</b></td><td>${b.client}</td><td>${b.car}</td><td>${b.from}</td><td>${b.to}</td><td><span class="status ${b.tone==='green'?'ok':b.tone==='orange'?'warn':'danger'}">${b.status}</span></td></tr>`).join('')}</tbody></table></div>`}
function adminLive(){return `<div class="grid g2"><div class="card map"><div class="pad" style="position:relative;z-index:2"><div class="eyebrow">Localisation live</div><h2 style="margin:5px 0">Flotte en France</h2><p class="muted">Positions simulées · mise à jour toutes les 5 secondes</p></div><div class="france"><svg viewBox="0 0 500 620" aria-label="Carte stylisée de la France"><path d="M214 18 L274 31 L318 72 L370 90 L393 135 L446 160 L425 205 L452 248 L430 290 L447 330 L420 366 L437 412 L404 454 L360 462 L343 503 L300 493 L270 528 L224 505 L186 521 L152 483 L112 470 L96 424 L59 397 L74 350 L48 319 L72 276 L61 237 L89 202 L76 158 L120 141 L138 98 L177 91 L182 53 Z" fill="#e9eff3" stroke="#c8d2da" stroke-width="4"/></svg></div><div class="pin p1"><span>Paris · 34</span></div><div class="pin p2"><span>Reims · 8</span></div><div class="pin p3"><span>Rennes · 16</span></div><div class="pin p4"><span>Strasbourg · 7</span></div><div class="pin p5"><span>Nantes · 12</span></div><div class="pin p6"><span>Lyon · 11</span></div><div class="pin p7"><span>Bordeaux · 9</span></div></div><div class="card pad"><div class="section-head"><h2>État de la flotte</h2><span class="status ok" id="fleetLive">LIVE</span></div>${[['Paris','34','92%'],['Rennes','16','86%'],['Nantes','12','81%'],['Lyon','11','74%'],['Bordeaux','9','69%'],['Strasbourg','7','63%']].map(x=>`<div style="padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between"><div><b>${x[0]}</b><div class="muted" style="font-size:11px">véhicules connectés</div></div><strong>${x[1]}</strong><span class="muted">${x[2]}</span></div>`).join('')}<br><button class="btn primary" style="width:100%" onclick="toast('Dernière synchronisation effectuée')">Synchroniser la flotte</button></div></div>`}
function adminAnalytics(){return `<div class="grid g4"><div class="kpi card"><div class="eyebrow">CA mensuel</div><div class="value" id="caLive">142 820 €</div><div class="delta">+9,8%</div></div><div class="kpi card"><div class="eyebrow">Panier moyen</div><div class="value">214 €</div><div class="delta">+4,3%</div></div><div class="kpi card"><div class="eyebrow">Taux d'occupation</div><div class="value" id="occLive">76%</div><div class="delta">+2,1 pts</div></div><div class="kpi card"><div class="eyebrow">Annulations</div><div class="value">3,4%</div><div class="delta">-0,7 pt</div></div></div><div class="grid g2 section"><div class="card chart"><div class="section-head"><h2>CA — évolution</h2><span class="status ok">LIVE</span></div><svg viewBox="0 0 600 230" preserveAspectRatio="none"><polyline id="line" fill="none" stroke="#e92f86" stroke-width="4" points="0,175 80,145 160,158 240,102 320,119 400,68 480,88 600,40"/></svg></div><div class="card chart"><div class="section-head"><h2>Mix de véhicules</h2><span class="muted">ce mois</span></div><div class="bars" id="mixBars"></div></div></div><div class="grid g2 section"><div class="card pad"><div class="section-head"><h2>Performance par agence</h2></div><table class="table"><tbody>${[['Paris','31 820 €','88%'],['Rennes','19 460 €','81%'],['Nantes','17 210 €','79%'],['Lyon','15 940 €','75%'],['Bordeaux','12 870 €','71%']].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div><div class="card pad"><div class="section-head"><h2>Alertes intelligentes</h2></div><div class="quote"><b>6 véhicules</b><br><span class="muted">révision prévue dans les 14 prochains jours.</span></div><div class="quote"><b>3 modèles</b><br><span class="muted">taux d'utilisation supérieur à 90%.</span></div><div class="quote"><b>Paris</b><br><span class="muted">demande élevée vendredi et samedi.</span></div></div></div>`}
function renderAnalytics(){let el=document.getElementById('mixBars');if(el)el.innerHTML=[38,31,19,12,26,22].map((n,i)=>`<div class="bar ${i===0?'hot':''}" style="height:${n*4}px"></div>`).join('')}
function openAI(){document.getElementById('modalContent').innerHTML=`<div class="eyebrow">Assistant DRIVE/RENT</div><h2>Que recherchez-vous ?</h2><p class="muted">Essayez : “automatique à moins de 80 €”, “SUV pour 5 personnes” ou “électrique à Paris”.</p><input class="input" id="aiq" style="width:100%" placeholder="Votre besoin…" onkeydown="if(event.key==='Enter')askAI()"><div id="aiout" class="quote" style="display:none"></div><br><button class="btn pink" style="width:100%" onclick="askAI()">Trouver des véhicules</button>`;openModal()}
function askAI(){let q=(document.getElementById('aiq').value||'').toLowerCase(),arr=cars.filter(c=>(q.includes('suv')?c[3].includes('SUV'):true)&&(q.includes('élect')?c[4].toLowerCase().includes('électrique'):true)&&(q.includes('autom')?c[5]==='Automatique':true)&&(!q.match(/(\d+)\s*€/)||+c[6]<=Number(q.match(/(\d+)\s*€/)[1]))).slice(0,4);let out=document.getElementById('aiout');out.style.display='block';out.innerHTML=arr.length?'<b>Je vous propose :</b><br>'+arr.map(c=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${c[1]} ${c[2]} — ${money(c[6])}/j <button class="btn" style="float:right;padding:5px 8px" onclick="closeModal();go('vehicle-${c[0]}')">Voir</button></div>`).join(''):'Aucun véhicule trouvé avec ces critères.'}
function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('dr_fav',JSON.stringify([...favorites]));toast(favorites.has(id)?'Ajouté aux favoris':'Retiré des favoris');render()}
function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
window.addEventListener('hashchange',render);document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function render(){route=location.hash.replace('#','')||'home';let content;if(route==='home')content=home();else if(route==='catalogue')content=catalogue();else if(route.startsWith('vehicle-'))content=vehicle(route.split('-')[1]);else if(route==='booking')content=bookingPage();else if(route.startsWith('booking-'))content=bookingPage(route.split('-')[1]);else if(route==='client')content=client();else if(route==='compare')content=compare();else if(route==='login')content=login();else if(route==='admin'||route.startsWith('admin-')){if(route==='admin-live')adminTab='live';if(route==='admin-reservations')adminTab='reservations';if(route==='admin-analytics')adminTab='analytics';if(route==='admin-fleet')adminTab='fleet';content=admin()}else content=home();app.innerHTML=content;if(route==='catalogue')renderCatalogue();if(route==='admin')renderDash();if(route==='admin'&&adminTab==='analytics')renderAnalytics();document.querySelectorAll('[data-count]').forEach(el=>{let n=+el.dataset.count,t=0,iv=setInterval(()=>{t+=Math.ceil(n/15);el.textContent=Math.min(t,n);if(t>=n)clearInterval(iv)},35)})}
setInterval(()=>{if(route==='admin'){let k=document.getElementById('liveKpi');if(k)k.textContent=27+Math.floor(Math.random()*5);let c=document.getElementById('caLive');if(c)c.textContent=money(142000+Math.floor(Math.random()*1900));let o=document.getElementById('occLive');if(o)o.textContent=(74+Math.floor(Math.random()*6))+'%'}},3500);
render();
</script>
