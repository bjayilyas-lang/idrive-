function ai(q){if(!q)return;let s=q.toLowerCase();let result;if(s.includes('élect')||s.includes('elect'))result=cars.filter(c=>c.fuel==='Électrique');else if(s.includes('suv'))result=cars.filter(c=>c.cat.includes('SUV'));else if(s.includes('premium')||s.includes('bmw')||s.includes('audi')||s.includes('mercedes'))result=cars.filter(c=>c.cat.includes('Premium'));else if(/\d+/.test(s)){let n=parseInt(s.match(/\d+/)[0]);result=cars.filter(c=>c.price<=n)}else result=cars.filter(c=>['Citadine','Compacte'].includes(c.cat));state.fleetFilter=result[0]?result[0].brand:'';state.cat='Tous';location.hash='fleet';setTimeout(()=>{if(result.length){toast(`${result.length} véhicule(s) correspondant(s)`);$('#fleetSearch').value='';renderFleet()}},200)}
function openChat(){if($('#chatPanel'))$('#chatPanel').classList.toggle('show')}
function sendChat(){let inp=$('#chatInput'),q=inp.value.trim();if(!q)return;let box=$('#chatMsgs');box.innerHTML+=`<div class="msg me">${esc(q)}</div>`;inp.value='';setTimeout(()=>{let answer=q.toLowerCase().includes('suv')?'Je peux vous proposer Captur, Duster, 2008 ou 3008 selon votre budget.':q.toLowerCase().includes('prix')?'Les tarifs commencent à 49€/jour dans la flotte actuelle.':'Je peux chercher par modèle, catégorie, énergie, boîte, budget ou agence.';box.innerHTML+=`<div class="msg">${answer}</div>`;box.scrollTop=box.scrollHeight},350)}
function openCommand(){let c=$('#command');c.innerHTML=`<div class="commandBox"><input id="cmdInput" autofocus placeholder="Rechercher une action…"><div class="cmdItem" data-route="fleet">▣ Ouvrir la flotte</div><div class="cmdItem" data-route="booking">＋ Nouvelle réservation</div><div class="cmdItem" data-route="planning">▦ Ouvrir le planning</div><div class="cmdItem" data-route="live">⌖ Voir la carte de France</div><div class="cmdItem" data-route="analytics">◔ Ouvrir les analytics</div></div>`;c.classList.add('show');$$('.cmdItem').forEach(x=>x.onclick=()=>{c.classList.remove('show');location.hash=x.dataset.route});c.onclick=e=>{if(e.target===c)c.classList.remove('show')}}
function updateBookingPrice(){let c=carBy(state.selectedCar);let extra=$$('.bookOpt:checked').reduce((a,x)=>a+Number(x.dataset.price),0);$('#sumOpt').textContent=extra+'€';$('#sumTotal').textContent=(c.price*3+12+extra)+'€'}
function confirmBooking(){let id='DR-'+(1055+reservations.length);reservations.push({id,client:'Camille Martin',car:carBy(state.selectedCar).brand+' '+carBy(state.selectedCar).name,city:'Rennes',start:'2026-09-21',end:'2026-09-24',status:'Confirmée',total:carBy(state.selectedCar).price*3+12});openModal(`<h2>Réservation confirmée ✓</h2><p>Votre dossier <b>${id}</b> est créé.</p><div class="feature"><h3>${carBy(state.selectedCar).brand} ${carBy(state.selectedCar).name}</h3><p>Rennes · 21/09/2026 → 24/09/2026</p></div><button class="primary pink" onclick="closeModal();location.hash='client'">Voir ma réservation</button>`);state.bookingStep=1}
function openReservation(id){let r=reservations.find(x=>x.id===id);if(!r)return;openModal(`<h2>${r.id}</h2><p><b>${r.client}</b> · ${r.car}</p><div class="bigForm"><div class="field" style="background:#f7f8f9"><label>Début</label><input id="editStart" type="date" value="${r.start}"></div><div class="field" style="background:#f7f8f9"><label>Fin</label><input id="editEnd" type="date" value="${r.end}"></div><div class="field" style="background:#f7f8f9"><label>Statut</label><select id="editStatus"><option ${r.status==='Confirmée'?'selected':''}>Confirmée</option><option ${r.status==='En attente'?'selected':''}>En attente</option><option>Annulée</option></select></div><div class="field" style="background:#f7f8f9"><label>Montant</label><input id="editTotal" value="${r.total}"></div></div><div style="display:flex;gap:9px;margin-top:15px"><button class="primary pink" id="saveRes">Enregistrer</button><button class="primary" id="contactClient">💬 Écrire au client</button></div>`);$('#saveRes').onclick=()=>{r.start=$('#editStart').value;r.end=$('#editEnd').value;r.status=$('#editStatus').value;r.total=Number($('#editTotal').value)||r.total;closeModal();app();toast('Réservation mise à jour')};$('#contactClient').onclick=()=>openModal(`<h2>Message à ${r.client}</h2><p style="color:#7d858c">Réservation ${r.id} · ${r.car}</p><textarea style="width:100%;height:150px;border:1px solid var(--line);border-radius:15px;padding:14px" placeholder="Bonjour ${r.client.split(' ')[0]}, …"></textarea><button class="primary pink" style="margin-top:12px" onclick="closeModal();toast('Message envoyé')">Envoyer le message</button>`)}
function openNewReservation(){openModal(`<h2>Nouvelle réservation</h2><div class="bigForm"><div class="field" style="background:#f7f8f9"><label>Client</label><input placeholder="Nom du client"></div><div class="field" style="background:#f7f8f9"><label>Véhicule</label><select>${cars.map(c=>`<option>${c.brand} ${c.name}</option>`).join('')}</select></div><div class="field" style="background:#f7f8f9"><label>Début</label><input type="date" value="2026-09-21"></div><div class="field" style="background:#f7f8f9"><label>Fin</label><input type="date" value="2026-09-24"></div></div><button class="primary pink" style="margin-top:15px" onclick="closeModal();toast('Nouvelle réservation créée')">Créer la réservation</button>`)}
function openModal(content){$('#modalBack').innerHTML=`<div class="modal">${content}</div>`;$('#modalBack').classList.add('show');$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()}}
function closeModal(){$('#modalBack').classList.remove('show')}
function initMap(){if(!window.L||!$('#franceMap'))return;$('#franceMap').innerHTML='';let map=L.map('franceMap',{scrollWheelZoom:false}).setView([46.7,2.3],5.4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);cities.forEach((c,i)=>{let color=i%5===0?'#e51c74':i%3===0?'#f3a000':'#14a56b';let icon=L.divIcon({className:'x',html:`<div style="width:18px;height:18px;border-radius:50%;background:${color};border:4px solid #fff;box-shadow:0 4px 12px #0004"></div>`,iconSize:[18,18]});L.marker([c[1],c[2]],{icon}).addTo(map).bindPopup(`<b>${c[0]}</b><br>${c[3]} véhicules actifs`)});setInterval(()=>{cities.forEach(c=>c[3]+=Math.random()>.7?1:0)},6000)}
function initClientMap(){if(!window.L||!$('#clientMap'))return;let map=L.map('clientMap',{zoomControl:false,scrollWheelZoom:false}).setView([48.1173,-1.6778],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);L.marker([48.1173,-1.6778]).addTo(map).bindPopup('Rennes Gare').openPopup()}
function startAnalytics(){state.chartTimer=setInterval(()=>{if(!$('#analyticsBars'))return;$$('#analyticsBars .bar').forEach(b=>b.style.height=(35+Math.random()*55)+'%');let o=74+Math.floor(Math.random()*8);$('#occ').textContent=o+'%';$('#basket').textContent=(185+Math.floor(Math.random()*28))+'€';$('#conv').textContent=(7.8+Math.random()*2).toFixed(1)+'%';},3500)}
function randomAnalytics(){if($('#analyticsBars'))$$('#analyticsBars .bar').forEach(b=>b.style.height=(30+Math.random()*65)+'%');$('#occ').textContent=(72+Math.floor(Math.random()*10))+'%';$('#basket').textContent=(180+Math.floor(Math.random()*35))+'€';$('#conv').textContent=(7.5+Math.random()*2.5).toFixed(1)+'%';$('#cancel').textContent=(3+Math.random()*2).toFixed(1)+'%'}
window.addEventListener('hashchange',()=>{if(state.chartTimer)clearInterval(state.chartTimer);app();window.scrollTo(0,0)});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommand()}});app();
</script></body></html>
