<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRIVE/RENT — mobilité intelligente</title>
<meta name="description" content="DRIVE/RENT — location automobile intelligente, configurateur, planning, flotte, budget et assistant IA.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://unpkg.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
--cream:#f3ead9;--paper:#fbf6ec;--paper2:#fffdf8;--ink:#1c150f;--ink2:#5c5045;--muted:#8a7d6d;
--line:rgba(28,21,15,.1);--glass:rgba(255,253,248,.6);--glassline:rgba(255,255,255,.8);
--orange:#ff5a2c;--orange2:#ffb199;--pink:#e51c74;--pink2:#ff8fbd;--blue:#6f8cff;--purple:#b18cff;
--green:#1c9d6b;--red:#e34b3c;--gold:#e8a23d;
--shadow:0 22px 60px rgba(90,55,20,.14);--shadowsm:0 8px 24px rgba(90,55,20,.1);
--r:28px;--r2:20px;--r3:14px;--nav:88px;
--disp:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;--body:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;
--car-color:#1c150f;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
[style*="--car-color"] svg{width:100%;height:auto;display:block}
body{margin:0;font-family:var(--body);color:var(--ink);background:
radial-gradient(circle at 12% -10%,#fff7e8 0,transparent 45%),
radial-gradient(circle at 100% 0%,#ffe4d1 0,transparent 40%),
radial-gradient(circle at 50% 120%,#ffe0ee 0,transparent 45%),
var(--cream);overflow-x:hidden;cursor:none}
@media(hover:none){body{cursor:auto}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
@media(hover:hover){button,a,.clickable,input,select{cursor:none}}
a{text-decoration:none;color:inherit}
h1,h2,h3,h4{font-family:var(--disp);margin:0;letter-spacing:-.02em;font-weight:800}
p{line-height:1.6;color:var(--ink2)}
::selection{background:var(--orange);color:#fff}
.app{min-height:100vh}
.shell{max-width:1420px;margin:auto;padding:30px 34px 90px}

/* cursor */
#cursorDot,#cursorRing{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;transform:translate(-50%,-50%);transition:opacity .2s}
#cursorDot{width:7px;height:7px;background:var(--orange);opacity:0}
#cursorRing{width:34px;height:34px;border:1.5px solid rgba(28,21,15,.45);opacity:0;transition:width .18s,height .18s,opacity .2s,background .18s,border-color .18s}
#cursorRing.big{width:56px;height:56px;background:rgba(255,90,44,.1);border-color:var(--orange)}
@media(hover:none){#cursorDot,#cursorRing{display:none}}

/* loader */
#loader{position:fixed;inset:0;z-index:10000;background:var(--ink);display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
#loader.hide{opacity:0;visibility:hidden}
.loadWrap{display:flex;flex-direction:column;align-items:center;gap:22px}
.loadMark{width:74px;height:74px;border-radius:22px;background:linear-gradient(135deg,var(--orange),var(--pink));display:grid;place-items:center;animation:pulse 1.4s ease-in-out infinite}
.loadMark span{width:30px;height:30px;border:4px solid #fff;border-radius:50%;position:relative}
.loadMark span:after{content:"";position:absolute;width:8px;height:8px;background:#fff;border-radius:50%;right:-6px;top:-6px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.loadBar{width:220px;height:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.loadBar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--orange),var(--pink));border-radius:3px;animation:load 1.3s cubic-bezier(.4,0,.2,1) forwards}
@keyframes load{to{width:100%}}
.loadTxt{color:#fff;font-family:var(--disp);font-weight:800;letter-spacing:.02em;font-size:14px;opacity:.85}

/* login gate */
#loginGate{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;background:
radial-gradient(circle at 20% 10%,#fff2df 0,transparent 50%),
radial-gradient(circle at 90% 90%,#ffd9ea 0,transparent 50%),var(--cream);padding:20px}
#loginGate.hide{display:none}
.loginCard{width:min(430px,100%);background:var(--glass);backdrop-filter:blur(22px);border:1px solid var(--glassline);border-radius:var(--r);box-shadow:var(--shadow);padding:38px 34px;position:relative;overflow:hidden}
.loginCard:before{content:"";position:absolute;width:220px;height:220px;background:radial-gradient(circle,var(--orange2),transparent 70%);top:-90px;right:-90px;opacity:.6;border-radius:50%}
.loginCard:after{content:"";position:absolute;width:180px;height:180px;background:radial-gradient(circle,var(--purple),transparent 70%);bottom:-80px;left:-80px;opacity:.35;border-radius:50%}
.loginTop{position:relative;z-index:1;display:flex;align-items:center;gap:11px;margin-bottom:26px}
.loginBrandmark{width:40px;height:40px;border-radius:13px;background:var(--ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.loginBrandmark span{width:17px;height:17px;border:3px solid #fff;border-radius:50%;position:relative;display:block}
.loginBrandmark span:after{content:"";position:absolute;width:6px;height:6px;background:var(--orange);border-radius:50%;right:-4px;top:-4px}
.loginBrandTxt{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.03em}
.loginTabs{position:relative;z-index:1;display:flex;gap:6px;background:rgba(28,21,15,.06);padding:5px;border-radius:999px;margin-bottom:22px}
.loginTabs button{flex:1;padding:10px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink2)}
.loginTabs button.active{background:var(--ink);color:#fff}
.loginField{position:relative;z-index:1;margin-bottom:13px}
.loginField label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.loginField input{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--paper2);outline:none;transition:border-color .2s,box-shadow .2s}
.loginField input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,90,44,.13)}
.loginErr{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin:2px 0 8px;position:relative;z-index:1}
.loginSubmit{position:relative;z-index:1;width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;font-weight:800;font-size:15px;box-shadow:0 14px 30px rgba(229,28,116,.28);transition:transform .2s}
.loginSubmit:hover{transform:translateY(-2px)}
.loginFoot{position:relative;z-index:1;text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px}

/* topbar */
.topbar{height:var(--nav);display:flex;align-items:center;gap:22px;padding:0 34px;position:sticky;top:0;background:rgba(246,238,222,.75);backdrop-filter:blur(20px);z-index:500;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.03em}
.brandmark{width:40px;height:40px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(28,21,15,.28)}
.brandmark span{display:block;width:17px;height:17px;border:3px solid #fff;border-radius:50%;position:relative}
.brandmark span:after{content:"";position:absolute;width:6px;height:6px;background:var(--orange);border-radius:50%;right:-4px;top:-4px}
.nav{display:flex;gap:5px;align-items:center;margin:auto;background:rgba(255,255,255,.4);padding:6px;border-radius:999px;border:1px solid var(--glassline)}
.nav button{padding:10px 15px;border-radius:999px;color:var(--ink2);font-weight:700;font-size:14px;transition:.2s}
.nav button:hover{color:var(--ink)}
.nav button.active{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(28,21,15,.25)}
.actions{display:flex;gap:9px;align-items:center}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--paper2);border:1px solid var(--line);box-shadow:var(--shadowsm);display:grid;place-items:center;font-size:16px;transition:transform .2s}
.iconbtn:hover{transform:translateY(-2px)}
.iconbtn.on{background:var(--pink);color:#fff;border-color:transparent}
.primary{background:var(--ink);color:#fff;border-radius:14px;padding:13px 19px;font-weight:800;font-size:14px;box-shadow:0 12px 24px rgba(28,21,15,.25);transition:.25s}
.primary:hover{transform:translateY(-2px)}
.ghost{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:13px 19px;font-weight:700;font-size:14px}
.grad{background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;border:0;box-shadow:0 14px 28px rgba(229,28,116,.25)}
.mobileMenu{display:none}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--paper2);border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.dot.pulse{animation:dotpulse 1.6s infinite}
@keyframes dotpulse{0%,100%{box-shadow:0 0 0 0 rgba(28,157,107,.5)}50%{box-shadow:0 0 0 6px rgba(28,157,107,0)}}

/* glass panel */
.glass{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glassline);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none;opacity:.55}
.panel{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadowsm)}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;min-height:600px;align-items:stretch;margin-top:4px}
.heroMain{padding:54px;display:flex;flex-direction:column;justify-content:center}
.heroMain .blob1{width:340px;height:340px;background:radial-gradient(circle,var(--orange2),transparent 70%);top:-140px;right:-100px}
.heroMain .blob2{width:260px;height:260px;background:radial-gradient(circle,var(--purple),transparent 70%);bottom:-120px;left:-60px;opacity:.3}
.eyebrow{position:relative;z-index:1;display:inline-flex;gap:8px;align-items:center;background:#fff;padding:9px 14px;border-radius:999px;font-size:12.5px;font-weight:800;box-shadow:var(--shadowsm);width:fit-content}
.hero h1{position:relative;z-index:1;font-size:60px;line-height:1.02;margin:20px 0 16px;max-width:11ch}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p.lead{position:relative;z-index:1;font-size:17px;max-width:44ch;margin-bottom:26px}
.heroBtns{position:relative;z-index:1;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:30px}
.heroSearch{position:relative;z-index:1;display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:0;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:6px;max-width:640px}
.heroSearch>div{padding:10px 14px;border-right:1px solid var(--line)}
.heroSearch>div:last-of-type{border-right:0}
.heroSearch label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.heroSearch input,.heroSearch select{border:0;outline:0;width:100%;font-weight:700;font-size:13.5px;background:none}
.heroSearch button{background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;border-radius:13px;padding:0 22px;font-weight:800;font-size:14px}
.heroSide{display:grid;gap:20px}
.heroCard{padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.heroCard .blob1{width:180px;height:180px;background:radial-gradient(circle,var(--blue),transparent 70%);top:-70px;right:-60px}
.heroStat{font-family:var(--disp);font-size:38px;font-weight:800;position:relative;z-index:1}
.heroStatLbl{font-size:13px;color:var(--ink2);font-weight:600;position:relative;z-index:1}
.heroCarWrap{position:relative;z-index:1;height:110px;display:flex;align-items:center;justify-content:center}
.heroCarWrap svg{width:78%;height:auto;filter:drop-shadow(0 12px 12px rgba(0,0,0,.14))}

/* section head */
.sectionHead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:70px 0 26px;flex-wrap:wrap}
.sectionHead h2{font-size:34px}
.sectionHead p{margin-top:6px;max-width:50ch}
.chip{display:inline-flex;padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--orange);margin-bottom:10px}

/* feature grid */
.featureGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.featureCard{padding:26px;transition:transform .25s}
.featureCard:hover{transform:translateY(-4px)}
.featureIcon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:21px;margin-bottom:16px;position:relative;z-index:1}
.featureCard h3{font-size:17px;margin-bottom:8px;position:relative;z-index:1}
.featureCard p{font-size:13.5px;position:relative;z-index:1;margin:0}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:30px 0}
.statCard{padding:24px;text-align:left}
.statCard .heroStat{font-size:32px}

/* fleet */
.catalogLayout{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
.sideFilters{position:sticky;top:calc(var(--nav) + 16px);padding:22px;display:flex;flex-direction:column;gap:20px}
.filterGroup h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px}
.filterChips{display:flex;flex-wrap:wrap;gap:7px}
.filterChips button{padding:8px 13px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:12.5px;font-weight:700}
.filterChips button.active{background:var(--ink);color:#fff;border-color:transparent}
.rangeRow{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.fleetToolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:14px;flex-wrap:wrap}
.searchBox{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 14px}
.searchBox input{border:0;outline:0;width:100%;background:none;font-weight:600}
.fleetGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.vcard{padding:20px;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.vcard:hover{transform:translateY(-6px);box-shadow:0 30px 60px rgba(90,55,20,.18)}
.vcardTop{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.vcardCat{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--orange)}
.favBtn{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:14px}
.favBtn.on{color:var(--pink)}
.vcardImg{height:130px;display:flex;align-items:center;justify-content:center;margin:6px 0;position:relative;z-index:1}
.vcardImg svg{width:88%;height:auto;filter:drop-shadow(0 14px 14px rgba(0,0,0,.14))}
.vcardName{font-family:var(--disp);font-weight:800;font-size:18px;position:relative;z-index:1}
.vcardBrand{font-size:12.5px;color:var(--muted);font-weight:700;position:relative;z-index:1}
.vcardMeta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;position:relative;z-index:1}
.vcardMeta span{font-size:11.5px;font-weight:700;background:var(--paper);padding:5px 9px;border-radius:8px;color:var(--ink2)}
.vcardFoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);position:relative;z-index:1}
.vcardPrice{font-family:var(--disp);font-weight:800;font-size:19px}
.vcardPrice small{font-size:11px;font-weight:700;color:var(--muted)}
.vcardUnavail{opacity:.55;filter:grayscale(.4)}

/* vehicle detail */
.vehiclePage{display:grid;grid-template-columns:1.3fr .9fr;gap:22px;align-items:start}
.vGallery{padding:30px}
.vGalleryMain{height:320px;display:flex;align-items:center;justify-content:center;position:relative}
.vGalleryMain svg{width:85%;height:auto;filter:drop-shadow(0 26px 22px rgba(0,0,0,.16))}
.vThumbs{display:flex;gap:10px;margin-top:18px;justify-content:center}
.vThumbs button{width:56px;height:56px;border-radius:13px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center}
.vThumbs button.active{border-color:var(--orange);background:#fff}
.vThumbs svg{width:70%}
.colorRow{display:flex;gap:10px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);position:relative}
.swatch.active{box-shadow:0 0 0 2.5px var(--orange)}
.vHead{padding:28px}
.vHead .vcardCat{font-size:12px}
.vHead h1{font-size:34px;margin:8px 0 4px}
.vHead .vcardBrand{font-size:14px}
.tabRow{display:flex;gap:6px;margin:20px 0 16px;background:var(--paper);padding:5px;border-radius:13px;flex-wrap:wrap}
.tabRow button{padding:9px 13px;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--ink2)}
.tabRow button.active{background:var(--ink);color:#fff}
.specGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.specItem{background:var(--paper);border-radius:13px;padding:14px 16px}
.specItem .l{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.specItem .v{font-family:var(--disp);font-weight:800;font-size:16px}
.vSummary{padding:26px;position:sticky;top:calc(var(--nav) + 16px)}
.priceRow{display:flex;align-items:baseline;gap:6px;margin-bottom:18px}
.priceRow b{font-family:var(--disp);font-size:32px}
.sumLine{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px dashed var(--line)}
.sumLine.total{border:0;font-weight:800;font-size:15.5px;padding-top:14px}

/* booking */
.bookWrap{display:grid;grid-template-columns:1.3fr .9fr;gap:22px;align-items:start}
.stepper{display:flex;gap:8px;margin-bottom:22px}
.stepDot{flex:1;text-align:center;padding:12px 8px;border-radius:13px;background:var(--paper);font-size:12px;font-weight:800;color:var(--muted);position:relative}
.stepDot.active{background:var(--ink);color:#fff}
.stepDot.done{background:var(--green);color:#fff}
.bookCard{padding:28px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);outline:none}
.field input:focus,.field select:focus{border-color:var(--orange)}
.optionCard{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:14px;background:var(--paper);border:2px solid transparent;margin-bottom:10px;transition:.2s}
.optionCard.active{border-color:var(--orange);background:#fff}
.optionCard b{display:block;font-size:14.5px}
.optionCard span{font-size:12.5px;color:var(--muted)}
.optionPrice{font-weight:800;font-family:var(--disp)}
.switch{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0}
.switch.on{background:var(--green)}
.switch i{position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch.on i{left:21px}
.bookNav{display:flex;justify-content:space-between;margin-top:22px}

/* admin shell */
.adminShell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - var(--nav))}
.adminSide{padding:26px 18px;display:flex;flex-direction:column;gap:4px;position:sticky;top:var(--nav);height:calc(100vh - var(--nav));background:rgba(255,253,248,.5);border-right:1px solid var(--line)}
.adminNav button{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:13px;font-weight:700;font-size:13.5px;color:var(--ink2);text-align:left}
.adminNav button.active{background:var(--ink);color:#fff}
.adminNav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin:16px 8px 4px}
.adminMain{padding:28px 32px 80px}
.adminKpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpiCard{padding:20px}
.kpiTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kpiIcon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px}
.kpiTrend{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px}
.kpiTrend.up{background:#e6f6ee;color:var(--green)}
.kpiTrend.down{background:#fdeceb;color:var(--red)}
.kpiVal{font-family:var(--disp);font-size:27px;font-weight:800}
.kpiLbl{font-size:12.5px;color:var(--muted);font-weight:600}
.dashboardGrid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.chartCard{padding:22px}
.chartHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.chartHead h3{font-size:16px}
.legendRow{display:flex;gap:14px;font-size:12px;font-weight:700}
.legendRow span{display:flex;align-items:center;gap:6px}
.legendDot{width:9px;height:9px;border-radius:50%}

/* finance / budget */
.financeGrid{display:grid;grid-template-columns:1.4fr .9fr;gap:18px}
.budgetBar{margin-bottom:16px}
.budgetBarTop{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.budgetBarTop small{color:var(--muted);font-weight:600}
.budgetTrack{height:10px;border-radius:999px;background:var(--paper);overflow:hidden}
.budgetFill{height:100%;border-radius:999px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.txRow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.txIcon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.txMain{flex:1;min-width:0}
.txMain b{display:block;font-size:13.5px}
.txMain span{font-size:12px;color:var(--muted)}
.txAmt{font-family:var(--disp);font-weight:800;font-size:14.5px;white-space:nowrap}
.txAmt.in{color:var(--green)}
.txAmt.out{color:var(--red)}
.donutWrap{display:flex;align-items:center;gap:18px}
.donutLegend{display:flex;flex-direction:column;gap:9px;font-size:12.5px;font-weight:700}
.donutLegend div{display:flex;align-items:center;gap:8px;justify-content:space-between;gap:12px}
.donutLegend .sw{width:9px;height:9px;border-radius:50%}

/* planning */
.timeline{display:grid;grid-template-columns:150px repeat(7,1fr);gap:2px;background:var(--line);border-radius:16px;overflow:hidden}
.timeline>div{background:var(--paper2);padding:10px 8px;font-size:12px}
.timeline .head{font-weight:800;background:var(--paper);text-align:center}
.tlCar{font-weight:700;display:flex;align-items:center;font-size:12.5px}
.tlSlot{position:relative;min-height:46px}
.tlBar{position:absolute;top:4px;left:2px;right:2px;bottom:4px;border-radius:8px;font-size:10.5px;color:#fff;display:flex;align-items:center;padding:0 6px;font-weight:700;overflow:hidden}

/* live map */
.liveGrid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.map{height:480px;border-radius:var(--r2);overflow:hidden}
.liveCard{padding:16px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.liveCard .live-svg{width:60px;flex-shrink:0}
.liveCard .live-svg svg{width:100%;height:auto;display:block}

/* analytics chart */
.chartSvgWrap{width:100%;height:220px}
.barsRow{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:10px}
.barsRow .bar{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--orange),var(--pink));transition:height 1s cubic-bezier(.4,0,.2,1);min-height:4px}

/* client */
.clientGrid{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}
.miniCard{padding:20px;display:flex;flex-direction:column;gap:6px}
.resItem{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:14px;background:var(--paper);margin-bottom:10px}
.statusPill{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px}
.statusPill.ok{background:#e6f6ee;color:var(--green)}
.statusPill.pend{background:#fff3e0;color:var(--gold)}

/* modal / toast / command / chat */
.modalBack{position:fixed;inset:0;background:rgba(20,14,9,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
.modalBack.show{display:flex}
.modal{background:var(--paper2);border-radius:var(--r);max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:30px;box-shadow:var(--shadow);position:relative}
.modalClose{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;font-size:13.5px;z-index:3000;transition:transform .3s;box-shadow:0 16px 30px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}
.command{position:fixed;inset:0;background:rgba(20,14,9,.5);backdrop-filter:blur(4px);z-index:2500;display:none;justify-content:center;padding-top:12vh}
.command.show{display:flex}
.cmdBox{background:var(--paper2);width:min(560px,92vw);border-radius:20px;box-shadow:var(--shadow);height:fit-content;overflow:hidden}
.cmdBox input{width:100%;border:0;padding:20px;font-size:16px;outline:0;border-bottom:1px solid var(--line);background:none}
.cmdList button{display:block;width:100%;text-align:left;padding:13px 20px;font-weight:600;font-size:14px}
.cmdList button:hover{background:var(--paper)}
.chatFab{position:fixed;bottom:26px;right:26px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--pink));box-shadow:0 16px 34px rgba(229,28,116,.35);display:grid;place-items:center;color:#fff;font-size:22px;z-index:1500}
.chatPanel{position:fixed;bottom:96px;right:26px;width:min(370px,calc(100vw - 30px));max-height:70vh;background:var(--paper2);border-radius:22px;box-shadow:var(--shadow);z-index:1500;display:none;flex-direction:column;overflow:hidden}
.chatPanel.show{display:flex}
.chatHead{padding:16px 18px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center}
.chatBody{padding:16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.chatMsg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.5}
.chatMsg.bot{background:var(--paper);align-self:flex-start;border-bottom-left-radius:4px}
.chatMsg.user{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chatInput{display:flex;border-top:1px solid var(--line);padding:10px}
.chatInput input{flex:1;border:0;outline:0;padding:10px;background:none}
.chatInput button{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#fff}
.france-svg{width:100%;height:auto}

</div>
<div class="dashboardGrid">
<div class="glass chartCard"><div class="chartHead"><h3>Réservations par jour</h3><span class="badge">30 derniers jours</span></div><div class="chartSvgWrap" id="lineChart"></div></div>
<div class="glass chartCard"><h3 style="margin-bottom:14px">Occupation par catégorie</h3><div id="analyticsBars" class="barsRow">${Array.from({length:6}).map(()=>`<div class="bar" style="height:${30+Math.random()*60}%"></div>`).join('')}</div></div>
</div>
<div class="glass chartCard" style="margin-top:18px"><h3 style="margin-bottom:14px">Répartition des revenus par catégorie</h3><div class="donutWrap" id="analyticsDonut"></div></div>
</main></div>`}
function donutSvg(segments,size=150){
const total=segments.reduce((a,s)=>a+s.v,0);let acc=0;const r=size/2-14,cx=size/2,cy=size/2,circ=2*Math.PI*r;
const arcs=segments.map(s=>{const frac=s.v/total;const dash=frac*circ;const off=circ-acc*circ/total;acc+=s.v;
return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="20" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dasharray 1s"/>`}).join('');
return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="19" fill="var(--ink)">${total.toLocaleString('fr-FR')}€</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="700">total</text></svg>`}
function lineChartSvg(points,w=560,h=200,color='#ff5a2c'){
const max=Math.max(...points),min=Math.min(...points);
const step=w/(points.length-1);
const pts=points.map((p,i)=>[i*step,h-8-((p-min)/(max-min||1))*(h-30)]);
const d=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
const area=d+` L${w} ${h} L0 ${h} Z`;
const id='g'+Math.random().toString(36).slice(2,7);
return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
<path d="${area}" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.6s ease forwards"/>
${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('')}
</svg><style>@keyframes draw{to{stroke-dashoffset:0}}</style>`}

function openChat(){$('#chatPanel').classList.add('show');if(!$('#chatPanel').innerHTML)initChat()}
function initChat(){$('#chatPanel').innerHTML=`<div class="chatHead"><b>✦ Assistant DRIVE/RENT</b><button class="clickable" id="chatClose" style="color:#fff;font-size:18px">✕</button></div><div class="chatBody" id="chatBody"><div class="chatMsg bot">Bonjour ! Je peux vous aider à trouver un véhicule, comparer des modèles ou suivre votre budget. Que puis-je faire pour vous ?</div></div><div class="chatInput"><input id="chatInput" placeholder="Écrivez votre message…"><button class="clickable" id="chatSend">→</button></div>`;
$('#chatClose').onclick=()=>$('#chatPanel').classList.remove('show');
$('#chatSend').onclick=sendChat;$('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});}
function sendChat(){const inp=$('#chatInput');const q=inp.value.trim();if(!q)return;
$('#chatBody').insertAdjacentHTML('beforeend',`<div class="chatMsg user">${esc(q)}</div>`);inp.value='';
$('#chatBody').scrollTop=$('#chatBody').scrollHeight;
setTimeout(()=>{$('#chatBody').insertAdjacentHTML('beforeend',`<div class="chatMsg bot">${aiAnswer(q)}</div>`);$('#chatBody').scrollTop=$('#chatBody').scrollHeight},450)}
function aiAnswer(q){const s=q.toLowerCase();
if(/budget|dépense|finance|argent|trésorerie/.test(s))return "Ce mois-ci le solde net est positif. Consultez l'onglet Budget & finances de l'espace admin pour le détail par catégorie et les courbes de trésorerie.";
if(/électrique|tesla|ev\b/.test(s))return "Nous avons plusieurs modèles 100% électriques : Tesla Model 3/Model Y, Peugeot e-208, Renault Mégane E-Tech, ID.3, Mustang Mach-E et Jaguar I-Pace.";
if(/suv/.test(s))return "Côté SUV, je recommande le Peugeot 3008 ou le Tucson pour un bon rapport confort/prix, ou le Model Y si vous voulez de l'électrique.";
if(/prix|tarif|combien/.test(s))return "Les tarifs vont de 49€/jour pour une citadine à plus de 250€/jour pour un SUV électrique premium. Filtrez par budget dans la Flotte.";
if(/réserv|book/.test(s))return "Je peux vous rediriger vers le configurateur de réservation — dites-moi simplement quel véhicule vous intéresse.";
return "Bonne question ! Explorez la Flotte pour comparer les modèles, ou dites-moi votre budget et votre trajet, je vous proposerai un véhicule adapté.";}

L.marker([c[1],c[2]],{icon}).addTo(map).bindPopup(`<b>${c[0]}</b><br>${c[3]} véhicules actifs`)});
if(!state._mapTimer)state._mapTimer=setInterval(()=>{cities.forEach(c=>c[3]+=Math.random()>.7?1:0)},6000)}
function initClientMap(){if(!window.L||!$('#clientMap'))return;let map=L.map('clientMap',{zoomControl:false,scrollWheelZoom:false}).setView([48.1173,-1.6778],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);L.marker([48.1173,-1.6778]).addTo(map).bindPopup('Rennes Gare').openPopup()}

/* ---------- ANALYTICS ANIMATION ---------- */
function startAnalytics(){
if($('#lineChart'))$('#lineChart').innerHTML=lineChartSvg(Array.from({length:14}).map(()=>20+Math.random()*80),560,200,'#ff5a2c');
if($('#analyticsDonut'))$('#analyticsDonut').innerHTML='';
state.chartTimer=setInterval(()=>{
if(!$('#analyticsBars')){clearInterval(state.chartTimer);return}
$$('#analyticsBars .bar').forEach(b=>b.style.height=(30+Math.random()*65)+'%');
$$('#revBars .bar').forEach(b=>b.style.height=(30+Math.random()*65)+'%');
let o=74+Math.floor(Math.random()*10);$('#occ')&&($('#occ').textContent=o+'%');
$('#basket')&&($('#basket').textContent=(185+Math.floor(Math.random()*30))+'€');
$('#conv')&&($('#conv').textContent=(7.8+Math.random()*2).toFixed(1)+'%');
$('#cancel')&&($('#cancel').textContent=(3+Math.random()*2).toFixed(1)+'%');
if($('#lineChart')&&Math.random()>.6)$('#lineChart').innerHTML=lineChartSvg(Array.from({length:14}).map(()=>20+Math.random()*80),560,200,'#ff5a2c');
},3200)}
function animateCounter(){const el=$('#homeCounter');if(!el)return;let n=0;const target=2480;const step=Math.ceil(target/60);
const t=setInterval(()=>{n+=step;if(n>=target){n=target;clearInterval(t)}el.textContent=n.toLocaleString('fr-FR')},20)}

/* ---------- ROUTER ---------- */
function currentRoute(){const h=(location.hash||'#home').slice(1).split('/');return{route:h[0]||'home',id:h[1]}}
function app(){
if(state.chartTimer)clearInterval(state.chartTimer);
const {route,id}=currentRoute();state.route=route;
let html='';
if(route==='home')html=home();
else if(route==='fleet')html=fleet();
else if(route==='vehicle')html=vehicle(id);
else if(route==='compare')html=compare();
else if(route==='booking'){html=booking(id);state.bookingStep=state.bookingStep||1}
else if(route==='client')html=client();
else if(route==='admin')html=adminOverview();
else if(route==='planning')html=planning();
else if(route==='live')html=live();
else if(route==='analytics')html=analytics();
else if(route==='finance')html=finance();
else if(route==='fleetAdmin')html=fleetAdmin();
else html=home();
$('#app').innerHTML=html;
$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===route));
if(route==='home'){initMap('franceMapHome');animateCounter()}
if(route==='fleet')renderFleet();
if(route==='live')initMap('franceMap');
if(route==='client')initClientMap();
if(route==='analytics')startAnalytics();
window.scrollTo(0,0);
}

/* ---------- GLOBAL EVENT WIRING ---------- */
function toggleFav(id){if(state.favorites.has(id))state.favorites.delete(id);else state.favorites.add(id);localStorage.setItem('dr-fav',JSON.stringify([...state.favorites]));toast(state.favorites.has(id)?'Ajouté aux favoris':'Retiré des favoris')}
document.addEventListener('click',e=>{
const t=e.target.closest('[data-route]');
if(t){e.preventDefault();const id=t.dataset.id;location.hash='#'+t.dataset.route+(id?'/'+id:'');if(t.dataset.route==='vehicle'){state.vTab='perf';state.selectedColor=null}if(t.dataset.route==='booking')state.bookingStep=1;app();return}

const adm=e.target.closest('[data-admin]');
if(adm){location.hash='#'+adm.dataset.admin;app();return}

const fav=e.target.closest('[data-fav]');
if(fav){toggleFav(fav.dataset.fav);app();return}

const setcat=e.target.closest('[data-setcat]');if(setcat){state.cat=setcat.dataset.setcat;app();return}
const setfuel=e.target.closest('[data-setfuel]');if(setfuel){state.fuel=setfuel.dataset.setfuel;app();return}
const setsort=e.target.closest('[data-setsort]');if(setsort){state.sort=setsort.dataset.setsort;app();return}
if(e.target.id==='resetFilters'){state.cat='Tous';state.fuel='Tous';state.fleetFilter='';state.sort='popular';app();return}

const vtab=e.target.closest('[data-vtab]');if(vtab){state.vTab=vtab.dataset.vtab;const c=carBy(state.selectedCar);
$('#specGrid').innerHTML=({perf:[['Puissance',c.power+' ch'],['0-100 km/h',c.accel+' s'],['Boîte',c.gear],['Énergie',c.fuel]],
design:[['Silhouette',c.cat],['Couleur','Personnalisable'],['Places',c.seats],['Coffre',c.trunk+' L']],
safety:[['Aide au freinage','Standard'],['Régulateur adaptatif',c.price>90?'Oui':'Option'],['Caméra 360°',c.price>130?'Oui':'Non'],['Note sécurité','5 étoiles Euro NCAP']],
comfort:[['Climatisation','Automatique'],['Sièges chauffants',c.price>100?'Oui':'Option'],['Toit ouvrant',c.price>150?'Oui':'Non'],['Multimédia','Écran tactile + CarPlay']]})[state.vTab].map(([l,v])=>`<div class="specItem"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
$$('.tabRow button').forEach(b=>b.classList.toggle('active',b.dataset.vtab===state.vTab));return}

const swatch=e.target.closest('[data-color]');
if(swatch){const hex=swatch.dataset.color;state.selectedColor=hex;$('#vGalleryBox').style.setProperty('--car-color',hex);$$('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.color===hex));toast('Teinte appliquée');return}

const thumb=e.target.closest('[data-thumb]');if(thumb){$$('.vThumbs button').forEach(b=>b.classList.remove('active'));thumb.classList.add('active');return}

const optc=e.target.closest('.optionCard');if(optc){const sw=optc.querySelector('.switch');sw.classList.toggle('on');optc.classList.toggle('active');updateBookingPrice();return}

const cmp=e.target.closest('#addCompare');if(cmp){let arr=state.compareIds.slice();const id=cmp.dataset.id;if(!arr.includes(id)){arr.push(id);if(arr.length>3)arr.shift()}state.compareIds=arr;localStorage.setItem('dr-cmp',JSON.stringify(arr));toast('Ajouté au comparateur');return}
const swap=e.target.closest('[data-swap]');if(swap){openModal(`<h3 style="font-size:18px;margin-bottom:14px">Choisir un véhicule</h3><div style="max-height:50vh;overflow:auto">${cars.map(c=>`<button class="clickable ghost" data-swapto="${swap.dataset.swap}|${c.id}" style="display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 14px">${c.brand} ${c.name} — ${c.price}€/j</button>`).join('')}</div>`);return}
const swapto=e.target.closest('[data-swapto]');if(swapto){const[from,to]=swapto.dataset.swapto.split('|');state.compareIds=state.compareIds.map(x=>x===from?to:x);localStorage.setItem('dr-cmp',JSON.stringify(state.compareIds));closeModal();app();return}

if(e.target.id==='bNext'){if(state.bookingStep<4){state.bookingStep++;$('#bookStepBox').innerHTML=bookingStep(carBy(state.selectedCar));if(state.bookingStep===2)updateBookingPrice()}return}
if(e.target.id==='bPrev'){if(state.bookingStep>1){state.bookingStep--;$('#bookStepBox').innerHTML=bookingStep(carBy(state.selectedCar))}return}
if(e.target.id==='bCar'){}
if(e.target.id==='hsGo'){location.hash='#fleet';app();toast('Recherche lancée');return}
if(e.target.id==='heroAi'){openChat();return}

if(e.target.id==='mobileNav'){openModal(`<h3 style="margin-bottom:16px">Menu</h3>${[['home','Accueil'],['fleet','Flotte'],['booking','Réserver'],['compare','Comparer'],['client','Mon espace'],['admin','Admin']].map(r=>`<button class="clickable ghost" data-route="${r[0]}" style="display:block;width:100%;margin-bottom:8px;padding:12px">${r[1]}</button>`).join('')}<button class="clickable ghost" id="mobileLogout" style="display:block;width:100%;margin-top:6px;padding:12px;color:var(--red)">Déconnexion</button>`);return}
if(e.target.id==='mobileLogout'){closeModal();localStorage.removeItem('dr-user');state.user='';location.hash='#home';$('#loginGate').classList.remove('hide');renderLogin();return}
if(e.target.id==='logoutBtn'){localStorage.removeItem('dr-user');state.user='';location.hash='#home';$('#loginGate').classList.remove('hide');renderLogin();return}
if(e.target.id==='cmdBtn'){openCommand();return}
if(e.target===$('#command')){closeCommand();return}
const cmdr=e.target.closest('[data-cmdroute]');if(cmdr){closeCommand();location.hash='#'+cmdr.dataset.cmdroute;app();return}
const cmdc=e.target.closest('[data-cmdcar]');if(cmdc){closeCommand();location.hash='#vehicle/'+cmdc.dataset.cmdcar;app();return}
if(e.target.id==='chatOpen'){$('#chatPanel').classList.contains('show')?$('#chatPanel').classList.remove('show'):openChat();return}

if(e.target.id==='addTx'){openModal(`<h3 style="font-size:18px;margin-bottom:16px">Nouvelle opération</h3>
<div class="field" style="margin-bottom:12px"><label>Type</label><select id="txType"><option value="in">Encaissement</option><option value="out">Dépense</option></select></div>
<div class="field" style="margin-bottom:12px"><label>Catégorie</label><input id="txCat" placeholder="Maintenance, Location…"></div>
<div class="field" style="margin-bottom:12px"><label>Libellé</label><input id="txLabel" placeholder="Description"></div>
<div class="field" style="margin-bottom:18px"><label>Montant (€)</label><input id="txAmt" type="number" placeholder="0"></div>
<button class="primary grad clickable" id="txSave" style="width:100%">Enregistrer</button>`);return}
if(e.target.id==='txSave'){const amt=parseFloat($('#txAmt').value)||0;transactions.unshift({id:'T-'+Math.floor(Math.random()*900+100),type:$('#txType').value,cat:$('#txCat').value||'Autre',label:$('#txLabel').value||'Opération',date:'2026-09-22',amount:amt});closeModal();app();toast('Opération enregistrée');return}

if(e.target.id==='newRes'||e.target.closest('[data-editres]')||e.target.closest('[data-editid]')){
const editId=e.target.closest('[data-editid]')?.dataset.editid;
const existing=editId?reservations.find(r=>r.id===editId):null;
openModal(`<h3 style="font-size:18px;margin-bottom:16px">${existing?'Éditer la réservation '+existing.id:'Nouvelle réservation'}</h3>
<div class="formGrid">
<div class="field"><label>Client</label><input id="rClient" value="${existing?existing.client:''}"></div>
<div class="field"><label>Véhicule</label><select id="rCar">${cars.map(c=>`<option ${existing&&existing.car===(c.brand+' '+c.name)?'selected':''}>${c.brand} ${c.name}</option>`).join('')}</select></div>
<div class="field"><label>Début</label><input type="date" id="rStart" value="${existing?existing.start:'2026-09-24'}"></div>
<div class="field"><label>Fin</label><input type="date" id="rEnd" value="${existing?existing.end:'2026-09-27'}"></div>
</div>
<button class="primary grad clickable" id="rSave" style="width:100%;margin-top:16px">Enregistrer</button>`);
window._editId=editId;return}
if(e.target.id==='rSave'){const data={client:$('#rClient').value||'Client',car:$('#rCar').value,start:$('#rStart').value,end:$('#rEnd').value,city:'Paris',status:'Confirmée',total:Math.floor(150+Math.random()*400)};
if(window._editId){const r=reservations.find(r=>r.id===window._editId);Object.assign(r,data)}else reservations.unshift({id:'DR-'+Math.floor(1000+Math.random()*9000),...data});
closeModal();app();toast('Réservation enregistrée');return}

if(e.target.id==='addVehicle'){toast("Formulaire d'ajout — fonctionnalité de démonstration");return}
});
document.addEventListener('input',e=>{
if(e.target.id==='fleetSearch'){state.fleetFilter=e.target.value;renderFleet()}
});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommand()}if(e.key==='Escape'){closeCommand();closeModal()}});

/* ---------- CURSOR ---------- */
(function(){
if(matchMedia('(hover:none)').matches)return;
const dot=$('#cursorDot'),ring=$('#cursorRing');let rx=0,ry=0,mx=0,my=0;
window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';dot.style.opacity='1';ring.style.opacity='1';
const over=e.target.closest('.clickable, button, a, input, select');ring.classList.toggle('big',!!over)});
function loop(){rx+=(mx-rx)*.18;ry+=(my-ry)*.18;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop)}
loop();
document.addEventListener('mouseleave',()=>{dot.style.opacity='0';ring.style.opacity='0'});
})();

/* ---------- INIT / LOADER / LOGIN ---------- */
window.addEventListener('hashchange',()=>{app()});
window.addEventListener('DOMContentLoaded',()=>{
setTimeout(()=>{
$('#loader').classList.add('hide');
const savedUser=localStorage.getItem('dr-user');
if(savedUser){state.user=savedUser;$('#loginGate').classList.add('hide');if(!location.hash)location.hash=savedUser==='admin'?'#admin':'#home';app()}
else{renderLogin()}
},1500);
});
</script></body></html>
