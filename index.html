function header(admin=false){const items=admin?[['admin','Overview'],['admin-fleet','Flotte'],['admin-reservations','Réservations'],['admin-live','Live Fleet'],['admin-analytics','Analytics']]:nav;return `<header class="topbar"><a class="brand" href="#home"><span class="mark">DR</span>DRIVE<span style="color:var(--pink2)">/</span>RENT</a><nav class="nav">${items.map(([r,t])=>`<a class="${route()===r?'active':''}" href="#${r}">${t}</a>`).join('')}</nav><div class="actions">${admin?link('home','Quitter','btn ghost'):link('login','Connexion','btn ghost')}${link('catalogue','Réserver','btn primary')}</div></header>`}
function mobileNav(admin=false){const items=admin?[['admin','⌂'],['admin-fleet','▦'],['admin-reservations','▣'],['admin-analytics','◒']]:[['home','⌂'],['catalogue','▦'],['compare','⇄'],['client','◉']];return `<nav class="mobile-nav">${items.map(([r,t])=>`<a href="#${r}">${t}</a>`).join('')}</nav>`}
function shell(content,admin=false){document.getElementById('app').innerHTML=`${header(admin)}${content}${mobileNav(admin)}`;chatWidget()}
function card(c){const fav=getJSON('driveFav',[]).includes(c.id);return `<article class="card car"><div class="car-media"><img src="${c.img}" alt="${c.brand} ${c.model}" loading="lazy" onerror="this.style.opacity=.25"><button class="fav ${fav?'on':''}" onclick="toggleFav(${c.id})">${fav?'♥':'♡'}</button></div><div class="car-body"><div class="car-brand">${c.brand} · ${c.year}</div><div class="car-title">${c.model}</div><div class="meta"><span>◉ ${c.seats} places</span><span>⌁ ${c.gear}</span><span>⚡ ${c.fuel}</span><span>● ${c.power} ch</span></div><div class="price-row"><div><span class="price">${fmt(c.price)}</span><span class="muted"> / jour</span></div><span class="badge ${c.status==='Disponible'?'':'warn'}">${c.status}</span></div><div class="card-actions">${link('vehicle?id='+c.id,'Détails','btn ghost')}${link('booking?id='+c.id,'Réserver','btn primary')}</div></div></article>`}
function toggleFav(id){let f=getJSON('driveFav',[]);f=f.includes(id)?f.filter(x=>x!==id):[...f,id];setJSON('driveFav',f);toast(f.includes(id)?'Véhicule ajouté aux favoris':'Véhicule retiré des favoris');render()}
function home(){shell(`<main class="container page"><section class="hero"><div class="hero-main"><div class="hero-copy"><div class="eyebrow">Premium mobility platform · 2026</div><h1>Drive<br><span>different.</span></h1><p>Une expérience de location automobile conçue comme un configurateur premium : choisissez, personnalisez, comparez et réservez.</p><div style="display:flex;gap:8px;margin-top:23px;flex-wrap:wrap">${link('catalogue','Explorer la flotte →','btn primary')}${link('compare','Comparer les modèles','btn ghost')}</div></div><div class="hero-orb"></div><img class="hero-car" src="${IMG.porsche}" alt="Porsche 911"></div><aside class="booking-box"><div class="headline"><div><div class="eyebrow">Smart booking</div><h3 style="margin-top:7px">Trouvez votre prochain véhicule.</h3></div><span class="badge">● LIVE</span></div><div class="search-grid"><div class="field"><label>Prise en charge</label><input id="homeFrom" value="Paris — Gare de Lyon"></div><div class="field"><label>Retour</label><input id="homeTo" value="Paris — Gare de Lyon"></div><div class="field"><label>Départ</label><input id="homeStart" type="date" value="2026-10-09"></div><div class="field"><label>Retour</label><input id="homeEnd" type="date" value="2026-10-12"></div></div><button class="big-search" onclick="homeSearch()">Rechercher des véhicules</button><div class="tiny">Tarifs indicatifs · disponibilité simulée · assurance configurable</div></aside></section><section class="stats"><div class="stat"><span class="tiny">Flotte</span><strong>500+</strong><span class="tiny">véhicules disponibles</span></div><div class="stat"><span class="tiny">Marques</span><strong>30+</strong><span class="tiny">du quotidien au luxe</span></div><div class="stat"><span class="tiny">Disponibilité</span><strong>98%</strong><span class="tiny">sur la plateforme</span></div><div class="stat"><span class="tiny">Villes</span><strong>15</strong><span class="tiny">points de retrait</span></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Curated fleet</div><h2>Choisissez votre univers.</h2><p>De la citadine à la supercar.</p></div>${link('catalogue','Voir toute la flotte →','btn ghost')}</div><div class="chips">${['Citadine','Compacte','SUV','Berline','Premium','Sport','Supercar','Électrique'].map(x=>`<button class="chip" onclick="location.hash='catalogue';setTimeout(()=>filterBy('${x}'),50)">${x}</button>`).join('')}</div><div class="grid">${cars.slice(0,8).map(card).join('')}</div></section><section class="section"><div class="bento"><div class="card promo wide" style="background:radial-gradient(circle at 75% 30%,rgba(240,90,168,.14),transparent 34%),linear-gradient(135deg,#131821,#0b0d12)"><div class="eyebrow">Assistant IA</div><h2>Décrivez votre trajet.<br>Nous trouvons la voiture.</h2><p>« Je pars 4 jours, 4 personnes, 900 € max. Je veux quelque chose de premium. »</p>${link('catalogue','Lancer une recherche intelligente →','btn primary')}</div><div class="card promo mid" style="background:linear-gradient(145deg,#141820,#101319)"><div class="eyebrow">Configurator</div><h2 style="font-size:31px">Configurez chaque détail.</h2><p>Couleur, options, assurance et prix final avant réservation.</p>${link('vehicle?id=12','Ouvrir un configurateur','btn ghost')}</div></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Why DRIVE/RENT</div><h2>Une expérience pensée comme un produit automobile.</h2></div></div><div class="spec-grid"><div class="spec"><div class="tiny">01 · Sélection</div><div class="v">+500</div><div class="muted">véhicules catalogués</div></div><div class="spec"><div class="tiny">02 · Config</div><div class="v">360°</div><div class="muted">galerie et personnalisation</div></div><div class="spec"><div class="tiny">03 · Booking</div><div class="v">4 étapes</div><div class="muted">de la recherche au paiement</div></div><div class="spec"><div class="tiny">04 · Admin</div><div class="v">LIVE</div><div class="muted">flotte, prix et réservations</div></div></div></section></main><footer class="footer"><div class="container">DRIVE/RENT · Démonstrateur de plateforme. Les prix sont indicatifs et modifiables dans l'espace administrateur. Les images externes servent au prototype.</div></footer>`)}
function homeSearch(){location.hash='catalogue';setTimeout(()=>{const s=document.getElementById('catalogSearch');if(s)s.focus()},80)}
function catalogue(){shell(`<main class="container page"><div class="section-head"><div><div class="eyebrow">Fleet / 2026</div><h2>La flotte.</h2><p>Recherche instantanée, filtres avancés et réservation.</p></div><div class="tiny"><strong>${cars.length}</strong> modèles dans le catalogue</div></div><div class="panel" style="padding:14px;margin-bottom:15px"><div style="display:grid;grid-template-columns:1.4fr .7fr .7fr .7fr;gap:8px"><div class="field"><label>Recherche</label><input id="catalogSearch" placeholder="BMW, Audi RS6, Porsche…" oninput="applyFilters()"></div><div class="field"><label>Catégorie</label><select id="catFilter" onchange="applyFilters()"><option value="all">Toutes</option>${['Citadine','Compacte','Berline','Break','SUV','Luxe','Sport','Supercar','Électrique'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Énergie</label><select id="fuelFilter" onchange="applyFilters()"><option value="all">Toutes</option><option>Essence</option><option>Diesel</option><option>Hybride</option><option>Électrique</option></select></div><div class="field"><label>Prix max / jour</label><input id="priceFilter" type="number" value="2500" oninput="applyFilters()"></div></div></div><div class="chips">${['all','Citadine','SUV','Berline','Premium','Sport','Supercar','Électrique'].map((x,i)=>`<button class="chip ${i===0?'active':''}" data-chip="${x}" onclick="filterBy('${x}')">${x==='all'?'Tous':x}</button>`).join('')}</div><div id="catalogGrid" class="grid">${cars.map(card).join('')}</div></main>`)}
function filterBy(cat){const el=document.getElementById('catFilter');if(el)el.value=cat==='Premium'?'Luxe':cat==='all'?'all':cat;document.querySelectorAll('[data-chip]').forEach(x=>x.classList.toggle('active',x.dataset.chip===cat));applyFilters()}
function applyFilters(){const q=(document.getElementById('catalogSearch')?.value||'').toLowerCase();const cat=document.getElementById('catFilter')?.value||'all';const fuel=document.getElementById('fuelFilter')?.value||'all';const max=Number(document.getElementById('priceFilter')?.value||99999);const list=cars.filter(c=>(`${c.brand} ${c.model}`.toLowerCase().includes(q))&&(cat==='all'||c.category===cat)&&(fuel==='all'||c.fuel===fuel)&&c.price<=max);document.getElementById('catalogGrid').innerHTML=list.length?list.map(card).join(''):`<div class="panel" style="grid-column:1/-1;padding:40px;text-align:center"><h3>Aucun véhicule trouvé</h3><p class="muted">Modifie les filtres ou demande une recommandation à l'assistant IA.</p></div>`}
function currentCar(){const id=Number(new URLSearchParams(location.hash.split('?')[1]||'').get('id')||new URLSearchParams(location.search).get('id')||1);return cars.find(c=>c.id===id)||cars[0]}
function vehicle(){const c=currentCar();shell(`<main class="container page"><div class="detail"><section class="visual"><img src="${c.img}" alt="${c.brand} ${c.model}"><div class="visual-overlay"><div style="display:flex;justify-content:space-between;align-items:start"><div><div class="eyebrow">${c.category} · ${c.year}</div><div class="visual-title">${c.brand}<br>${c.model}</div></div><span class="badge">${c.status}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap">${['Overview','Design','Performance','Comfort','Safety'].map((x,i)=>`<button class="chip ${i===0?'active':''}" onclick="toast('${x} sélectionné')">${x}</button>`).join('')}</div></div></section><aside class="stack"><div class="panel"><div class="eyebrow">Vehicle configurator</div><h3 style="margin:6px 0">${c.brand} ${c.model}</h3><p class="muted">Configurez votre expérience avant de réserver.</p><div class="tabs"><button class="tab active">Extérieur</button><button class="tab">Jantes</button><button class="tab">Intérieur</button></div><div class="tiny" style="margin-top:15px">Couleur</div><div class="colors">${['#f2f2f0','#15171b','#8b96a4','#dca7c5','#4b6258','#3e5269'].map((x,i)=>`<button class="swatch ${i===0?'active':''}" style="background:${x}" onclick="setSwatch(this,'${x}')"></button>`).join('')}</div></div><div class="panel"><div class="eyebrow">Performance</div><div class="spec-grid" style="grid-template-columns:1fr 1fr;margin-top:12px"><div class="spec"><div class="tiny">Puissance</div><div class="v">${c.power} ch</div></div><div class="spec"><div class="tiny">0 — 100</div><div class="v">${c.accel}s</div></div><div class="spec"><div class="tiny">Couple</div><div class="v">${c.torque} Nm</div></div><div class="spec"><div class="tiny">Vmax</div><div class="v">${c.topSpeed}</div></div></div></div><div class="panel"><div class="eyebrow">Caractéristiques</div><div style="display:grid;gap:9px;margin-top:13px"><div style="display:flex;justify-content:space-between"><span class="muted">Transmission</span><strong>${c.gear}</strong></div><div style="display:flex;justify-content:space-between"><span class="muted">Énergie</span><strong>${c.fuel}</strong></div><div style="display:flex;justify-content:space-between"><span class="muted">Places</span><strong>${c.seats}</strong></div><div style="display:flex;justify-content:space-between"><span class="muted">Autonomie</span><strong>${c.range} km</strong></div></div></div><div class="panel"><div class="price-row"><div><div class="tiny">À partir de</div><div class="price">${fmt(c.price)}</div><span class="muted"> / jour</span></div><span class="badge">★ ${c.rating}</span></div><div class="card-actions">${link('booking?id='+c.id,'Réserver ce véhicule','btn primary')}</div></div></aside></div><section class="section"><div class="section-head"><div><div class="eyebrow">Highlights</div><h2>Tout ce qui compte.</h2></div></div><div class="spec-grid"><div class="spec"><div class="tiny">Motorisation</div><div class="v">${c.fuel}</div></div><div class="spec"><div class="tiny">Transmission</div><div class="v">${c.gear}</div></div><div class="spec"><div class="tiny">Coffre</div><div class="v">${c.category==='Supercar'?'132':'480'} L</div></div><div class="spec"><div class="tiny">Localisation</div><div class="v">${c.city}</div></div></div></section></main>`)}
function setSwatch(el,color){document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));el.classList.add('active');toast('Configuration couleur mise à jour')}
function booking(){const c=currentCar();shell(`<main class="container page"><div class="section-head"><div><div class="eyebrow">Reservation / ${c.brand}</div><h2>Réserver ${c.model}.</h2><p>Prix recalculé automatiquement selon les dates et options.</p></div></div><div class="booking-layout"><section class="panel"><div class="steps"><div class="step active">01 · Dates</div><div class="step">02 · Options</div><div class="step">03 · Paiement</div></div><div class="form"><div class="search-grid"><div class="field"><label>Départ</label><input id="bStart" type="date" value="2026-10-09" onchange="calcBooking(${c.id})"></div><div class="field"><label>Retour</label><input id="bEnd" type="date" value="2026-10-12" onchange="calcBooking(${c.id})"></div><div class="field"><label>Lieu de prise en charge</label><select id="bCity"><option>Paris — Gare de Lyon</option><option>Paris — CDG</option><option>Lyon — Part-Dieu</option><option>Rennes — Centre</option><option>Nice — Aéroport</option></select></div><div class="field"><label>Lieu de retour</label><select><option>Même lieu</option><option>Paris — CDG</option><option>Lyon — Part-Dieu</option></select></div></div><div class="section" style="margin-top:10px"><div class="eyebrow">Assurance</div><div class="spec-grid" style="grid-template-columns:repeat(3,1fr)"><label class="spec"><input type="radio" name="ins" value="0" checked onchange="calcBooking(${c.id})"> Basic<br><span class="tiny">Franchise standard</span></label><label class="spec"><input type="radio" name="ins" value="18" onchange="calcBooking(${c.id})"> Premium<br><span class="tiny">+18 €/jour</span></label><label class="spec"><input type="radio" name="ins" value="32" onchange="calcBooking(${c.id})"> Full<br><span class="tiny">+32 €/jour</span></label></div></div><div class="section"><div class="eyebrow">Options</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><label class="field"><input type="checkbox" data-opt="GPS" data-price="9" onchange="calcBooking(${c.id})"> GPS <span class="muted">+9 €/jour</span></label><label class="field"><input type="checkbox" data-opt="Conducteur supplémentaire" data-price="15" onchange="calcBooking(${c.id})"> Conducteur <span class="muted">+15 €/jour</span></label><label class="field"><input type="checkbox" data-opt="Siège enfant" data-price="7" onchange="calcBooking(${c.id})"> Siège enfant <span class="muted">+7 €/jour</span></label><label class="field"><input type="checkbox" data-opt="Livraison" data-price="39" onchange="calcBooking(${c.id})"> Livraison <span class="muted">+39 €</span></label></div></div><button class="big-search" onclick="goPay(${c.id})">Continuer vers le paiement →</button></div></section><aside class="stack"><div class="panel"><div class="eyebrow">Résumé</div><div style="display:flex;gap:12px;margin:12px 0"><img src="${c.img}" style="width:130px;height:80px;object-fit:cover;border-radius:13px"><div><strong>${c.brand} ${c.model}</strong><div class="tiny">${c.city} · ${c.power} ch</div></div></div><div style="display:grid;gap:10px;border-top:1px solid var(--line);padding-top:13px"><div style="display:flex;justify-content:space-between"><span class="muted">Véhicule</span><span id="sumCar">${fmt(c.price*3)}</span></div><div style="display:flex;justify-content:space-between"><span class="muted">Assurance + options</span><span id="sumOptions">0 €</span></div><div style="display:flex;justify-content:space-between;font-weight:700"><span>Total</span><span id="sumTotal" class="total">${fmt(c.price*3)}</span></div></div></div><div class="panel"><div class="eyebrow">Paiement sécurisé</div><p class="muted" style="line-height:1.6">Le paiement est simulé dans ce prototype. Aucune donnée bancaire réelle n'est stockée.</p></div></aside></div></main>`);calcBooking(c.id)}
function daysBetween(a,b){const d=(new Date(b)-new Date(a))/86400000;return Math.max(1,Math.ceil(d||1))}
function calcBooking(id){const c=cars.find(x=>x.id===id)||cars[0];const a=document.getElementById('bStart')?.value,b=document.getElementById('bEnd')?.value;if(!a||!b)return;const days=daysBetween(a,b);let extra=Number(document.querySelector('input[name="ins"]:checked')?.value||0)*days;document.querySelectorAll('[data-opt]:checked').forEach(x=>extra+=Number(x.dataset.price||0)*(x.dataset.opt==='Livraison'?1:days));const base=c.price*days;const total=base+extra;document.getElementById('sumCar').textContent=fmt(base);document.getElementById('sumOptions').textContent=fmt(extra);document.getElementById('sumTotal').textContent=fmt(total);window._booking={id,days,base,extra,total,start:a,end:b}}
function goPay(id){if(!window._booking)calcBooking(id);const b=window._booking,c=cars.find(x=>x.id===id);modal(`<div class="modal-box"><div class="eyebrow">03 · Paiement</div><h2 style="margin:7px 0">Finaliser la réservation.</h2><p class="muted">${c.brand} ${c.model} · ${b.days} jour(s) · ${fmt(b.total)}</p><div class="form" style="margin-top:18px"><input placeholder="Nom sur la carte"><input placeholder="Numéro de carte · 4242 4242 4242 4242"><div class="search-grid"><input placeholder="MM/AA"><input placeholder="CVV"></div><button class="big-search" onclick="confirmBooking(${id})">Payer ${fmt(b.total)}</button></div></div>`)}
function confirmBooking(id){const b=window._booking,c=cars.find(x=>x.id===id);const list=getJSON('driveBookings',[]);list.unshift({id:'DR-'+Date.now(),vehicle:c.brand+' '+c.model,start:b.start,end:b.end,total:b.total,status:'Confirmée'});setJSON('driveBookings',list);c.status='Loué';setJSON('driveCars',cars);modal(`<div class="modal-box" style="text-align:center;padding:45px"><div style="font-size:48px">✓</div><div class="eyebrow">Reservation confirmed</div><h2 style="margin:8px 0">C'est réservé.</h2><p class="muted">${c.brand} ${c.model}<br>${b.start} → ${b.end}<br>${fmt(b.total)}</p>${link('client','Voir mes réservations','btn primary')}</div>`)}
function client(){const bookings=getJSON('driveBookings',[]),fav=getJSON('driveFav',[]);shell(`<main class="container page"><div class="section-head"><div><div class="eyebrow">Client OS</div><h2>Bonjour, Alex.</h2><p>Votre mobilité, en un coup d'œil.</p></div>${link('catalogue','Nouvelle réservation','btn primary')}</div><div class="stats"><div class="stat"><span class="tiny">Réservations</span><strong>${12+bookings.length}</strong></div><div class="stat"><span class="tiny">Disponibilité</span><strong>98%</strong></div><div class="stat"><span class="tiny">CO₂ évités</span><strong>16.2 kg</strong></div><div class="stat"><span class="tiny">Favoris</span><strong>${fav.length}</strong></div></div><div class="bento"><div class="card promo wide"><div class="eyebrow">Prochaine réservation</div><h2>BMW M4 Competition</h2><p>Paris — Gare de Lyon · 09 oct. → 12 oct. 2026</p><span class="badge">Confirmée</span></div><div class="card promo mid"><div class="eyebrow">Assistant IA</div><h2 style="font-size:30px">Que voulez-vous faire ?</h2><p>Comparer, réserver ou estimer un trajet.</p><button class="btn primary" onclick="openChat()">Ouvrir l'assistant</button></div></div><section class="section"><div class="section-head"><div><div class="eyebrow">Historique</div><h2>Mes locations.</h2></div></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Réservation</th><th>Véhicule</th><th>Dates</th><th>Total</th><th>Statut</th></tr></thead><tbody>${bookings.length?bookings.map(b=>`<tr><td>#${b.id}</td><td>${b.vehicle}</td><td>${b.start} → ${b.end}</td><td>${fmt(b.total)}</td><td><span class="badge">${b.status}</span></td></tr>`).join(''):'<tr><td colspan="5" class="muted">Aucune réservation enregistrée. Votre prochaine location apparaîtra ici.</td></tr>'}</tbody></table></div></section></main>`)}
function compare(){const ids=getJSON('compareCars',[7,12,18]).filter(id=>cars.some(c=>c.id===id)).slice(0,4);const selected=ids.map(id=>cars.find(c=>c.id===id));shell(`<main class="container page"><div class="section-head"><div><div class="eyebrow">Compare</div><h2>Comparez les modèles.</h2><p>Sélectionnez jusqu'à 4 véhicules.</p></div></div><div class="panel" style="padding:18px"><div style="display:flex;gap:8px;flex-wrap:wrap">${selected.map(c=>`<span class="chip active">${c.brand} ${c.model} <button style="border:0;background:transparent;color:white" onclick="removeCompare(${c.id})">×</button></span>`).join('')}<button class="chip" onclick="addCompare()">+ Ajouter un véhicule</button></div></div><div class="panel table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Critère</th>${selected.map(c=>`<th>${c.brand}<br>${c.model}</th>`).join('')}</tr></thead><tbody>${[['Prix / jour',c=>fmt(c.price)],['Puissance',c=>c.power+' ch'],['0–100 km/h',c=>c.accel+' s'],['Transmission',c=>c.gear],['Énergie',c=>c.fuel],['Places',c=>c.seats],['Autonomie',c=>c.range+' km'],['Vitesse max',c=>c.topSpeed+' km/h'],['Note',c=>'★ '+c.rating]].map(([k,f])=>`<tr><td><strong>${k}</strong></td>${selected.map(c=>`<td>${f(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></main>`)}
function removeCompare(id){setJSON('compareCars',getJSON('compareCars',[]).filter(x=>x!==id));render()}
function addCompare(){const id=cars.find(c=>!getJSON('compareCars',[]).includes(c.id))?.id;if(id){const a=getJSON('compareCars',[]);a.push(id);setJSON('compareCars',a);render()}}
function login(){document.getElementById('app').innerHTML=`<main class="login-page"><section class="login-box"><a class="brand" href="#home"><span class="mark">DR</span>DRIVE/RENT</a><h1>Bienvenue.</h1><p class="muted">Choisissez votre espace.</p><div class="form"><input id="loginU" placeholder="Identifiant"><input id="loginP" type="password" placeholder="Mot de passe"><button class="btn primary" onclick="doLogin()">Se connecter →</button></div><div class="quick"><button class="btn ghost" onclick="loginU.value='client';loginP.value='client'">Client / client</button><button class="btn ghost" onclick="loginU.value='admin';loginP.value='admin'">Admin / admin</button></div><div class="notice" style="margin-top:15px">Comptes de démonstration : <strong>client / client</strong> et <strong>admin / admin</strong>.</div></section></main>`}
function doLogin(){const u=document.getElementById('loginU').value,p=document.getElementById('loginP').value;if(u==='admin'&&p==='admin'){sessionStorage.setItem('role','admin');location.hash='admin'}else if(u==='client'&&p==='client'){sessionStorage.setItem('role','client');location.hash='client'}else toast('Identifiants incorrects')}
function adminShell(body){shell(`<div class="admin-layout"><aside class="side">${[['admin','Overview'],['admin-fleet','Flotte & prix'],['admin-reservations','Réservations'],['admin-live','Live Location'],['admin-analytics','Analytics']].map(([r,t])=>`<a class="${route()===r?'active':''}" href="#${r}">${t}</a>`).join('')}<div style="height:1px;background:var(--line);margin:14px 0"></div><div class="tiny" style="padding:0 13px;line-height:1.6">ADMIN MODE<br><span style="color:var(--pink2)">Prix modifiables</span><br>Stockage local démo</div></aside><main class="admin-main">${body}</main></div>`,true)}
function admin(){adminShell(`<div class="section-head"><div><div class="eyebrow">Administration / Overview</div><h2>Command center.</h2><p>Flotte, revenus, réservations et disponibilité.</p></div><span class="badge">● SYSTEM ONLINE</span></div><div class="admin-grid"><div class="card admin-card span3"><div class="tiny">Flotte</div><div class="number">${cars.length}</div><span class="badge">+12 ce mois</span></div><div class="card admin-card span3"><div class="tiny">Disponibles</div><div class="number">${cars.filter(c=>c.status==='Disponible').length}</div><span class="badge">${Math.round(cars.filter(c=>c.status==='Disponible').length/cars.length*100)}%</span></div><div class="card admin-card span3"><div class="tiny">Réservations</div><div class="number">284</div><span class="badge">+18.4%</span></div><div class="card admin-card span3"><div class="tiny">Revenus</div><div class="number">84,2k€</div><span class="badge">+12.7%</span></div><div class="card admin-card span8"><div class="eyebrow">Revenue / bookings</div><div class="chart">${[45,52,48,62,58,71,67,81,75,91,86,98].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div></div><div class="card admin-card span4"><div class="eyebrow">Fleet health</div><div style="display:grid;gap:14px;margin-top:20px">${[['Disponible',68,'var(--green)'],['Loué',22,'var(--pink)'],['Maintenance',7,'var(--yellow)'],['Hors service',3,'var(--red)']].map(x=>`<div><div style="display:flex;justify-content:space-between"><span>${x[0]}</span><span>${x[1]}%</span></div><div style="height:7px;background:#222630;border-radius:9px;margin-top:6px"><div style="width:${x[1]}%;height:100%;background:${x[2]};border-radius:9px"></div></div></div>`).join('')}</div></div><div class="card admin-card span12"><div class="section-head"><div><div class="eyebrow">Quick actions</div><h3>Gestion rapide</h3></div></div><div style="display:flex;gap:8px;flex-wrap:wrap">${link('admin-fleet','Modifier les prix →','btn primary')}${link('admin-reservations','Voir les réservations →','btn ghost')}${link('admin-live','Ouvrir Live Fleet →','btn ghost')}${link('admin-analytics','Voir Analytics →','btn ghost')}</div></div></div>`)}
function adminFleet(){adminShell(`<div class="section-head"><div><div class="eyebrow">Fleet management</div><h2>Flotte & tarifs.</h2><p>Modifie le prix, le statut, la ville ou ajoute un véhicule. Les changements sont conservés dans ce navigateur.</p></div><button class="btn primary" onclick="openAddCar()">+ Ajouter un véhicule</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Véhicule</th><th>Catégorie</th><th>Ville</th><th>Statut</th><th>Prix / jour</th><th>Action</th></tr></thead><tbody>${cars.map(c=>`<tr><td><strong>${c.brand} ${c.model}</strong><br><span class="tiny">${c.year} · ${c.power} ch</span></td><td>${c.category}</td><td><select onchange="changeCar(${c.id},'city',this.value)">${['Paris','Lyon','Rennes','Bordeaux','Nice','Marseille'].map(v=>`<option ${c.city===v?'selected':''}>${v}</option>`).join('')}</select></td><td><select onchange="changeCar(${c.id},'status',this.value)">${['Disponible','Loué','Maintenance','Réservé'].map(v=>`<option ${c.status===v?'selected':''}>${v}</option>`).join('')}</select></td><td><input id="price-${c.id}" type="number" min="1" value="${c.price}"> €</td><td><button class="btn primary small" onclick="savePrice(${c.id})">Enregistrer</button></td></tr>`).join('')}</tbody></table></div>`)}
function savePrice(id){const c=cars.find(x=>x.id===id),v=Number(document.getElementById('price-'+id).value);if(v>0){c.price=v;setJSON('driveCars',cars);toast(`${c.brand} ${c.model} → ${fmt(v)} / jour`)}}
function changeCar(id,k,v){const c=cars.find(x=>x.id===id);c[k]=v;setJSON('driveCars',cars);toast('Véhicule mis à jour')}
function openAddCar(){modal(`<div class="modal-box"><div class="eyebrow">Fleet / New vehicle</div><h2 style="margin:7px 0 16px">Ajouter un véhicule.</h2><div class="form"><div class="search-grid"><input id="newBrand" placeholder="Marque"><input id="newModel" placeholder="Modèle"></div><div class="search-grid"><input id="newPrice" type="number" placeholder="Prix / jour"><input id="newPower" type="number" placeholder="Puissance ch"></div><div class="search-grid"><select id="newCat"><option>Citadine</option><option>Compacte</option><option>Berline</option><option>SUV</option><option>Luxe</option><option>Sport</option><option>Supercar</option><option>Électrique</option></select><select id="newFuel"><option>Essence</option><option>Diesel</option><option>Hybride</option><option>Électrique</option></select></div><button class="big-search" onclick="addCar()">Créer le véhicule</button></div></div>`)}
function addCar(){const id=Math.max(...cars.map(c=>c.id))+1,brand=document.getElementById('newBrand').value||'Nouvelle marque',model=document.getElementById('newModel').value||'Nouveau modèle',price=Number(document.getElementById('newPrice').value)||120,power=Number(document.getElementById('newPower').value)||180,cat=document.getElementById('newCat').value,fuel=document.getElementById('newFuel').value;cars.push({id,brand,model,category:cat,price,img:IMG.suv,power,accel:6.8,gear:'Auto',fuel,seats:cat==='Supercar'?2:5,range:fuel==='Électrique'?500:650,status:'Disponible',city:'Paris',year:2026,rating:'4.8',color:'#e7e8ea',torque:Math.round(power*1.45),topSpeed:240,doors:cat==='Supercar'?2:5});setJSON('driveCars',cars);closeModal();render();toast('Véhicule ajouté à la flotte')}
function adminReservations(){adminShell(`<div class="section-head"><div><div class="eyebrow">Bookings</div><h2>Planning des locations.</h2><p>Vue opérationnelle des réservations.</p></div></div><div class="panel table-wrap"><table class="table"><thead><tr><th>ID</th><th>Client</th><th>Véhicule</th><th>Départ</th><th>Retour</th><th>Total</th><th>Statut</th></tr></thead><tbody>${Array.from({length:15},(_,i)=>{const c=cars[(i*3)%cars.length];return `<tr><td>#DR-${10240+i}</td><td>${['Sophie Martin','Lucas Bernard','Emma Dupont','Nolan Roy','Maya Garcia'][i%5]}</td><td>${c.brand} ${c.model}</td><td>${String(3+i).padStart(2,'0')}/10/2026</td><td>${String(5+i).padStart(2,'0')}/10/2026</td><td>${fmt(c.price*(2+i%5))}</td><td><span class="badge ${i%7===0?'warn':''}">${i%7===0?'En attente':'Confirmée'}</span></td></tr>`}).join('')}</tbody></table></div>`)}
function adminLive(){adminShell(`<div class="section-head"><div><div class="eyebrow">Live location</div><h2>Flotte en direct.</h2><p>Carte simulée avec télémétrie des véhicules.</p></div><span class="badge">● LIVE</span></div><div class="bento"><div class="card wide map">${Array.from({length:16},(_,i)=>`<span class="pin" style="left:${8+(i*17)%84}%;top:${12+(i*29)%76}%" title="${cars[i%cars.length].brand} ${cars[i%cars.length].model}" onclick="toast('${cars[i%cars.length].brand} ${cars[i%cars.length].model} · ${cars[i%cars.length].city}')"></span>`).join('')}<div style="position:absolute;left:18px;bottom:18px;z-index:3" class="chip active">Paris · Lyon · Rennes · Bordeaux · Nice</div></div><div class="card mid" style="padding:20px"><div class="eyebrow">Telemetry</div><div style="display:grid;gap:9px;margin-top:14px">${cars.slice(0,8).map(c=>`<div class="spec" style="padding:12px"><div style="display:flex;justify-content:space-between"><strong>${c.brand} ${c.model}</strong><span class="badge">${c.status}</span></div><div class="tiny" style="margin-top:5px">${c.city} · ${c.range} km · ${c.fuel}</div></div>`).join('')}</div></div></div>`)}
function adminAnalytics(){adminShell(`<div class="section-head"><div><div class="eyebrow">Analytics</div><h2>Performance de la flotte.</h2></div></div><div class="admin-grid"><div class="card admin-card span3"><div class="tiny">Revenus mensuels</div><div class="number">84 240 €</div><span class="badge">+18.4%</span></div><div class="card admin-card span3"><div class="tiny">Taux occupation</div><div class="number">78.6%</div><span class="badge">+6.2%</span></div><div class="card admin-card span3"><div class="tiny">Durée moyenne</div><div class="number">4.7 j</div><span class="badge">+0.4</span></div><div class="card admin-card span3"><div class="tiny">Panier moyen</div><div class="number">342 €</div><span class="badge">+9.8%</span></div><div class="card admin-card span8"><div class="eyebrow">Revenus / 12 mois</div><div class="chart">${[45,55,50,64,61,72,68,80,75,88,82,96].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div></div><div class="card admin-card span4"><div class="eyebrow">Top catégories</div><div style="display:grid;gap:18px;margin-top:20px">${[['SUV',38],['Premium',26],['Berline',18],['Sport',11],['Citadine',7]].map(x=>`<div><div style="display:flex;justify-content:space-between"><span>${x[0]}</span><span>${x[1]}%</span></div><div style="height:7px;background:#222630;border-radius:9px;margin-top:6px"><div style="width:${x[1]*2.2}%;height:100%;background:var(--pink);border-radius:9px"></div></div></div>`).join('')}</div></div></div>`)}
function chatWidget(){document.getElementById('chat').innerHTML=`<div id="chatbox" class="chatbox"><div class="chat-head"><div><strong>Assistant IA</strong><div class="tiny">Recherche & réservation</div></div><button class="btn small ghost" onclick="openChat()">×</button></div><div id="messages" class="messages"><div class="msg">Bonjour 👋 Je peux trouver une voiture, comparer des modèles ou estimer votre budget.</div><div class="msg">Essayez : « SUV premium, 4 jours, moins de 900 € ».</div></div><div class="chat-input"><input id="chatInput" placeholder="Votre demande…" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn primary small" onclick="sendChat()">→</button></div></div><button class="chat-toggle" onclick="openChat()">✦</button>`}
function openChat(){document.getElementById('chatbox')?.classList.toggle('open')}
function sendChat(){const i=document.getElementById('chatInput'),v=i.value.trim();if(!v)return;const m=document.getElementById('messages');m.insertAdjacentHTML('beforeend',`<div class="msg user">${escapeHTML(v)}</div>`);i.value='';setTimeout(()=>{const q=v.toLowerCase();let found=cars.filter(c=>q.includes('suv')?c.category==='SUV':q.includes('électrique')?c.fuel==='Électrique':true).filter(c=>c.price<=(q.match(/(\d{3,4})\s*€/)?.[1]||99999)).slice(0,3);m.insertAdjacentHTML('beforeend',`<div class="msg">${found.length?'Je te propose : '+found.map(c=>`${c.brand} ${c.model} (${fmt(c.price)}/j)`).join(' · '):'Je peux rechercher par marque, catégorie, budget, énergie et nombre de jours. Donne-moi ton budget et tes dates.'}</div>`);m.scrollTop=m.scrollHeight},350)}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('modal').innerHTML=''}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function render(){const r=route();const pages={home,catalogue,vehicle,booking,client,compare,login,admin, 'admin-fleet':adminFleet,'admin-reservations':adminReservations,'admin-live':adminLive,'admin-analytics':adminAnalytics};(pages[r]||home)()}
window.addEventListener('hashchange',render);window.addEventListener('load',render);
</script>
</body></html>
